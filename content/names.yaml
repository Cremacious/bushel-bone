# Names config — the single source of truth for every NPC and location name (#45).
#
# Edit a name HERE, then run `npm run gen:names` (from prototype/) to propagate it
# into prototype/year1.html. Nothing else in the prototype hardcodes a display name:
# UI, dialog, and prose all reference these entries by a stable id, via tokens.
#
# Token grammar (resolved at render time, and inside the values below):
#   {{npc.<id>}}           -> that character's name        (e.g. {{npc.meredith}})
#   {{npc.<id>.role}}      -> role / {{npc.<id>.desc}} -> desc
#   {{loc.<id>}}           -> that location's caption      ({{loc.town.sub}}, .desc)
#   {{place.<id>}}         -> a recurring proper noun       (town, region, well)
#   {{lineage}}            -> the player's chosen family surname (from New Game)
#
# The canon roster lives in CLAUDE.md §4; the display names below are the shorter
# in-game forms of those characters. This file is what the Next.js port will load
# at runtime (per docs/content-schema.md); the prototype gets it via gen-names.mjs.

# Recurring proper nouns that appear in more than one place. Prose supplies the
# article ("the {{place.region}}"), so a rename never fights sentence casing.
places:
  town:   "Marrow's Cross"
  region: "Sallows"
  well:   "Old Well"

# Family surnames, shared by more than one character and used bare in prose
# ("Grange walks the fields", "Vane's wagon"). Rename a family once, here, and it
# flows into every full name below and every mention in dialogue.
terms:
  ridley:   "Ridley"
  halloway: "Halloway"
  grange:   "Grange"
  vane:     "Vane"

# The cast. id -> name (full display, composed from the surname above where the
# family recurs), first (first name, where prose uses it alone), role (nameplate
# subtitle), desc (portrait brief).
characters:
  farmer:    { name: "You",                        role: "the newcomer",         desc: "the newcomer, weathered and wary" }
  reuben:    { name: "Reuben",                      role: "your foreman",         desc: "{{npc.reuben}}, a field hand with a steady, tired face" }
  silas:     { name: "Silas {{term.ridley}}",       first: "Silas",  role: "the banker",           desc: "lean and correct, a good coat gone a little shabby" }
  halloway:  { name: "Mayor {{term.halloway}}",     role: "the mayor",            desc: "expansive and florid, a politician's warmth" }
  grange:    { name: "Preacher {{term.grange}}",    role: "the preacher",         desc: "gaunt and grave" }
  meredith:  { name: "Meredith {{term.vane}}",      first: "Meredith", role: "the saloonkeeper",     desc: "sharp-eyed and knowing" }
  bell:      { name: "Doc Bell",                    role: "the doctor",           desc: "dry and watchful behind spectacles" }
  bess:      { name: "Bess {{term.halloway}}",      first: "Bess",   role: "the mayor's daughter", desc: "young and direct, quick to read a face" }
  ruth:      { name: "Sister Ruth",                 first: "Ruth",   role: "the church's charity", desc: "plain and kind, and misses nothing" }
  coldwater: { name: "Sheriff Coldwater",           role: "the law",              desc: "cool and still, a long stare" }
  ambrose:   { name: "Dr. Ambrose {{term.vane}}",   role: "the clone merchant",   desc: "courteous, and does not quite meet the eye" }
  nan:       { name: "Old Nan",                     role: "the folk-magic woman", desc: "old and watchful, at the edge of things" }
  malachi:   { name: "Malachi",                     role: "your late uncle",      desc: "the uncle you never met" }
  crake:     { name: "Hollis Crake",            first: "Hollis",   role: "the toolwright",     desc: "a one-armed smith, sleeve pinned, sizing you up over the forge" }
  tolliver:  { name: "Prudence Tolliver",       first: "Prudence", role: "the shopkeep",       desc: "tight-mouthed behind a tidy counter, missing nothing" }
  fenwick:   { name: "Mr. Fenwick",             role: "the rail agent",     desc: "a company man in a good hat, all ledger and no warmth" }
  ostrander: { name: "Old Ostrander",           first: "Ostrander", role: "the rival farmer",  desc: "broad and weathered, a hard man who works his hands harder" }

# The places you see. id -> cap (place-name caption), sub (the specific spot),
# desc (the illustration brief). Values may reference the tokens above.
locations:
  homestead: { cap: "The Homestead",  sub: "the yard",         desc: "the homestead: four cleared fields, a lean-to, and a well capped in iron at the property's edge" }
  fields:    { cap: "The Homestead",  sub: "the fields",       desc: "the four fields under an open sky" }
  town:      { cap: "{{place.town}}", sub: "the town green",   desc: "a green between a white church and a low saloon, the town gathered" }
  church:    { cap: "{{place.town}}", sub: "the church",       desc: "the church at midnight, every candle lit, a capped well through the open door" }
  saloon:    { cap: "{{place.town}}", sub: "the saloon",       desc: "the saloon by lamplight, {{npc.meredith}} behind the bar" }
  wagon:     { cap: "The Track",      sub: "{{term.vane}}'s wagon", desc: "a black wagon hung with lanterns on the property track" }
  gate:      { cap: "The Homestead",  sub: "the gate at dusk", desc: "the gate at the fence-line as the light goes" }
  smithy:    { cap: "{{place.town}}", sub: "the smithy",       desc: "the smithy: a low forge, iron stacked, {{npc.crake}} at the anvil" }
  store:     { cap: "{{place.town}}", sub: "the general store", desc: "the general store, shelves close and orderly, {{npc.tolliver}} at the counter" }
  depot:     { cap: "{{place.town}}", sub: "the rail depot",    desc: "a raw plank depot at the end of the new line, a chalk price-board by the door" }
  jail:      { cap: "{{place.town}}", sub: "the jail",          desc: "the sheriff's office, a lamp low in the window" }
  doc:       { cap: "{{place.town}}", sub: "the doctor's rooms", desc: "{{npc.bell}}'s rooms, bottles ranked on a shelf" }
