# Wildlife events (§9). Threaten crops and stock. Fences (§8) cut the losses. One card
# (something-in-the-night) sits on the seam between wildlife and the Reckoning by design.

- id: crows-in-the-corn
  title: "Crows in the Corn"
  family: wildlife
  severity: minor
  illustration: "a black scatter of crows lifting off a corn-field, a leaning scarecrow they've plainly stopped fearing"
  setup: >
    The crows have found the corn and made a habit of it. Your scarecrow has stopped fooling
    them; they perch on his arms now, which feels like a comment. An unfenced field is an open
    invitation, and they've accepted.
  conditions:
    - not: { has_building: fences }
  on_ignore: worst
  choices:
    - id: keep-a-boy-on-them
      text: "Set a hand to scaring them off."
      cost: { labor: 1.0 }
      result: "A hand with a clapper and a long day keeps them thinned. It's a poor use of a pair of hands, but it's cheaper than the corn they'd take."
    - id: string-fences
      text: "Fence the field for good."
      cost: { coin: 15, labor: 2.0 }
      result: "You fence it proper: posts, wire, netting over the worst of it. The crows sulk on the line and find easier fields. It's done, and it stays done."
      effects:
        - unlock: { building: fences }
    - id: let-them-feed
      text: "Let them have their share."
      result: "You leave the crows to it and lose a fifth of the field to them by harvest. A share, they'd call it. Robbery, you'd call it. The corn's gone either way."
      effects:
        - crop: { field: this, blight: true }

- id: deer-at-dusk
  title: "Deer at Dusk"
  family: wildlife
  severity: minor
  illustration: "three deer stepping out of the cottonwood break into a field at last light, heads down"
  setup: >
    Deer come out of the cottonwood break at dusk and browse the young crop down to nothing,
    dainty and unhurried, gone before you can get a shot off. A fence turns them. A dog turns
    them. A hopeful nature does not.
  on_ignore: dismiss
  choices:
    - id: sit-up-for-them
      text: "Sit up with a rifle."
      outcomes:
        - odds: even
          result: "You take a deer at dusk and hang it in the smokehouse, meat for the winter store, and the rest of the herd gone shy of your fields for a while."
          effects:
            - food: { amount: +10 }
        - odds: even
          result: "You sit the cold through and see nothing but your own breath. The deer, wiser than you, browse a different field. You're tired the next day for it."
    - id: fence-them-out
      text: "Fence the crop."
      cost: { coin: 15, labor: 1.0 }
      result: "A fence turns the deer to easier grazing. Money and a day, spent to keep what you grew."
      effects:
        - unlock: { building: fences }

- id: wolves-at-the-fold
  title: "Wolves at the Fold"
  family: wildlife
  severity: major
  illustration: "grey shapes at the edge of lantern-light beyond the pen, the stock crowded to the far rail"
  setup: >
    There are wolves working the edge of the homestead. You hear the stock go frantic in the
    night and find them crowded to the far rail by morning, and once, prints in the mud bigger
    than your spread hand. They'll take a beast a week until something stops them.
  conditions:
    - has_building: barn
  on_ignore: worst
  choices:
    - id: sit-up-armed
      text: "Sit up nights until you get them."
      cost: { labor: 1.0 }
      result: "You lose sleep and a few nights' work, and you get one of the pack over the pen-rail. The others take the lesson and move on. The stock settles."
    - id: pen-them-tight
      text: "Bring the stock in tight and wait it out."
      result: "You crowd the stock into the barn and bar it. Safer, but a beast smothers in the crush, and the wolves take another that strayed. You lose two either way; you just choose how."
      effects:
        - food: { amount: -8 }

- id: fox-in-the-henhouse
  title: "Fox in the Henhouse"
  family: wildlife
  severity: minor
  illustration: "feathers scattered white across a coop floor at dawn, a low gap dug under the wall"
  setup: >
    A fox has been in the henhouse, feathers everywhere and two hens short, a neat hole dug
    under the wall. It'll be back tomorrow night, and the night after, until the digging's
    stopped.
  on_ignore: worst
  choices:
    - id: mend-the-coop
      text: "Sink the wall and mend the coop."
      cost: { labor: 1.0 }
      result: "You dig the wall in deep and wire the gaps. The fox tries once more, finds no way under, and goes to trouble a lazier neighbor."
    - id: leave-it
      text: "It's two hens. Leave it."
      result: "Two hens becomes the whole coop, one clever night at a time. By the week's end you're short your eggs and your temper both."
      effects:
        - food: { amount: -4 }

- id: the-stray-dog
  title: "A Stray Dog"
  family: wildlife
  severity: minor
  illustration: "a lean, wary dog at the edge of the yard, ribs showing, not quite willing to come or go"
  setup: >
    A stray dog has taken to hanging about the yard, lean and wary, no collar, keeping just
    out of reach. It's another mouth. It's also, if it settles, a set of ears against the
    crows and the fox and whatever else works the dark.
  once: true
  on_ignore: dismiss
  choices:
    - id: take-it-in
      text: "Feed it and let it stay."
      result: "A few scraps and a week of patience buy you a dog that sleeps in the barn and barks the wildlife off your fields. Cheap at the price of a bowl a day."
      effects:
        - item: { grant: farm_dog }
        - morale: { target: household, amount: +1 }
    - id: run-it-off
      text: "Run it off. You've mouths enough."
      result: "You send it down the road with a hard word. Sensible. The yard is quieter for it, in every sense, and the crows come back."

- id: something-in-the-night
  title: "Something in the Night"
  family: wildlife
  severity: minor
  illustration: "torn ground at a field's edge and a single deep track that is not a deer's and not a wolf's"
  setup: >
    Something was in the field last night. The ground is torn at the far edge and there's a
    track in the soft dirt: deep, and wrong, not a deer's and not a wolf's and not, if you're
    honest with yourself, anything you can put a name to. Probably a wolf. Probably.
  conditions:
    - reckoning_tier: { min: warnings }
  on_ignore: dismiss
  choices:
    - id: call-it-a-wolf
      text: "Call it a wolf and set a trap."
      cost: { coin: 4 }
      result: "You set a trap for a wolf. In the morning the trap is sprung and empty and bent, and you do not set it there again."
      effects:
        - morale: { target: household, amount: -2 }
    - id: ask-old-nan
      text: "Take the track's measure to Old Nan."
      requires:
        - relationship: { npc: old_nan, min: warm }
      result: "She looks at the shape you've scratched in the dirt for her a long moment. 'That's not a thing that eats crops,' she says. 'That's a thing that counts them. Mind what you've been growing, and how.'"
      effects:
        - morale: { target: household, amount: -1 }

- id: rabbits-in-the-garden
  title: "Rabbits"
  family: wildlife
  severity: minor
  illustration: "neat-nibbled rows of young greens at dawn, a rabbit sitting up unbothered among them"
  setup: >
    Rabbits have found the young greens and made a nightly habit of them, neat little nibbles down
    every row, and the culprits sitting up bold as brass at dawn. They breed faster than you can shoot,
    and multiply the trouble by the week.
  on_ignore: dismiss
  choices:
    - id: snare-them
      text: "Set snares along the runs."
      cost: { coin: 3 }
      result: "Wire snares along the rabbit-runs thin them out and put a little meat in the pot besides. A fair exchange, from the rabbits' side of it or yours."
      effects:
        - food: { amount: +3 }
    - id: let-them-nibble
      text: "It's a few greens. Let them be."
      result: "A few greens becomes most of a row, then two, as the rabbits breed to the size of the free meal. You'll wish you'd set the snares when you had the fewer of them to catch."

- id: the-bear
  title: "The Bear"
  family: wildlife
  severity: major
  illustration: "a great dark bear standing at the treeline at dusk, the stock gone silent, everything very still"
  setup: >
    A bear has come down out of the high ground, a big one, drawn by the stock or the stores or the
    smell of a hard winter coming. It stands at the treeline at dusk and watches the farm, and the
    animals have gone silent, and everything is very still. A bear is not a thing you shoo.
  weight: 5
  conditions:
    - season: [Summer, Fall]
  on_ignore: worst
  choices:
    - id: drive-it-off
      text: "Light fires and drive it off with noise."
      cost: { labor: 0.5 }
      result: "You ring the yard with fire and racket and stand your ground through a long night, and by morning the bear has thought better of it and gone back to the high ground. You do not sleep for a week."
    - id: give-it-a-beast
      text: "Stake out a beast and let it take that."
      result: "You give the bear an old pig staked at the treeline, and it takes the offering and leaves the rest. It's a beast you couldn't spare and a lesson in what the wild costs. Better the pig than a hand."
      effects:
        - food: { amount: -8 }

- id: birds-on-the-new-seed
  title: "Birds on the New Seed"
  family: wildlife
  severity: minor
  illustration: "a flock of small birds working a just-sown field, dust rising where they scratch"
  setup: >
    You've barely sown before the birds are on it: a whole flock working the field, scratching up the
    new seed faster than it can bed in. Seed on the ground is a bird's breakfast until it's under it.
  conditions:
    - season: Spring
  on_ignore: worst
  choices:
    - id: harrow-it-under
      text: "Harrow the seed under quick."
      cost: { labor: 0.5 }
      result: "You harrow the seed deeper than the birds will dig and lose only what was already lost. Quick work, and it saves the sowing."
    - id: resow
      text: "Let them feed; sow again over the gaps."
      cost: { seed: { crop: potato, amount: -4 } }
      result: "You let the birds take their fill and sow again into the bare patches. It costs you seed and a second sowing, and the birds are back for that too, but the field fills in eventually."

- id: wild-dogs-at-the-line
  title: "Wild Dogs at the Line"
  family: wildlife
  severity: minor
  illustration: "a lean pack of feral dogs slinking along the fence line at grey dawn, ribs and wariness"
  setup: >
    A pack of feral dogs works the fence line at dawn, gone wild off some failed farm, lean and
    wary and getting bolder. They'll worry the stock and worse, given the run of the place. A pack
    that learns a farm is easy comes back to it.
  on_ignore: worst
  choices:
    - id: drive-off-dogs
      text: "Run them off hard, so they learn."
      cost: { labor: 0.5 }
      result: "You go at them with noise and a rifle fired over their heads, and they learn your farm is the wrong kind of easy. They slink off to trouble a softer neighbor."
    - id: ignore-dogs
      text: "They're only dogs. Leave them."
      result: "The dogs take a hen, then a lamb, then grow bold enough for worse, because a pack that meets no answer keeps coming back for more of the same nothing."
      effects:
        - food: { amount: -5 }

- id: the-diggers
  title: "The Diggers"
  family: wildlife
  severity: flavor
  illustration: "a scatter of fresh earth-mounds across a field, a run of collapsed furrow, no culprit in sight"
  setup: >
    Something's tunneling the low field, moles, or gophers, or the ground just settling in its own way
    the way the old-timers say Sallows ground does. Mounds of fresh earth, a run of collapsed furrow, and
    never a digger to be seen. Probably moles. Probably.
  on_ignore: dismiss

- id: the-hawk
  title: "The Hawk"
  family: wildlife
  severity: flavor
  illustration: "a red-tailed hawk riding the wind high over the fields, a hush across the whole farm beneath it"
  setup: >
    A hawk has taken to hunting over your fields, a big red-tailed thing that rides the wind for hours,
    and where it hunts the mice and the rabbits and the small thieves go still and scarce. Some farmers
    shoot them. Wiser ones leave the hawk to keep the vermin honest.
  on_ignore: dismiss
  choices:
    - id: leave-the-hawk
      text: "Leave the hawk to its work."
      result: "You leave the hawk be, and it earns its keep: the field's the quieter of mice and rabbits for its patrols. The best hired hand you never paid."
      effects:
        - morale: { target: household, amount: +1 }
    - id: shoot-the-hawk
      text: "Shoot it off your stock."
      result: "You take a shot at the hawk to keep it off the chickens, and it lifts away and doesn't return. The chickens are safer. The mice, you'll find by harvest, are not, and there are a great many more of them than there were hawks."
