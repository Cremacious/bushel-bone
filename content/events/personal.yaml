# Personal events (§3/§5): the clones themselves — illness, quarrel, loyalty, despair,
# death and its disposal. This is the moral engine at the human scale. The burial card is
# the whole game in miniature; treat it with the restraint the style guide demands.

- id: a-hand-takes-fever
  title: "A Hand Takes Fever"
  family: personal
  severity: major
  illustration: "a clone flushed and shivering on a cot, a damp cloth on the brow, the others watching from the door"
  setup: >
    One of the hands has taken a fever — flushed and shaking and no use in the field, and
    getting worse. Doc Bell would come, for coin. Fevers pass, sometimes, left alone. In a
    hard winter, sometimes they don't.
  on_ignore: worst
  choices:
    - id: fetch-doc
      text: "Fetch Doc Bell. (20 marks)"
      cost: { coin: 20 }
      result: "Bell comes, dry and unhurried, and does what can be done. 'Keep them warm and let them rest,' he says. 'The rest of it's between them and their luck.' The fever breaks by week's end."
      effects:
        - morale: { target: household, amount: +2 }
    - id: rest-and-broth
      text: "Rest and broth and hope."
      outcomes:
        - odds: likely
          result: "A week of rest and thin broth and the fever passes on its own. You saved the twenty marks. You'll not always be so lucky."
        - odds: unlikely
          result: "The fever does not pass. It takes them in the night, quiet, and you are left with a cot to strip and a choice to make about the ground."
          effects:
            - clone: { kill: this, disposal: marked }
    - id: work-them-anyway
      text: "There's no time to be sick. Back to the field."
      result: "You drive a sick hand into the field and the fever does what fevers do to a worn body. They're worse by morning, and the household watches you differently for it."
      effects:
        - morale: { target: household, amount: -6 }
        - reckoning: +1

- id: a-hand-is-gone
  title: "A Hand is Gone"
  family: personal
  severity: major
  illustration: "a still form under a blanket in the bunkhouse, the other hands standing back, hats in hand, waiting on you"
  setup: >
    One of them is dead — fever, or the cold, or the year simply catching up with a frail body.
    The others have carried the still form to the barn and stand waiting, because the next part
    is yours. The ground is soft in the east field. It is always soft, out here. What you do now,
    the land remembers.
  on_ignore: worst
  choices:
    - id: marked-grave
      text: "A marked grave, and a stone."
      cost: { labor: 1.0 }
      result: "You dig a proper grave in dry ground and set a stone with a name on it. The others help without being asked. It costs a day and some timber and buys a household that knows what it's worth to you."
      effects:
        - morale: { target: household, amount: +2 }
    - id: unmarked-field
      text: "Bury them in the east field, unmarked. Save the day."
      result: "You put them in the soft warm ground where the digging's easy and set no stone. The field takes them. The hands go quiet, and do not look at the east field the same again, and neither, in time, will you."
      effects:
        - reckoning: +6
        - taint: { field: this, amount: +0.5 }
        - ghost_roll: { add: this }
        - morale: { target: household, amount: -10 }
    - id: sell-to-vane
      text: "Sell the body to Ambrose Vane. (15 marks)"
      result: "Ambrose takes the body without a word about what for, and leaves fifteen marks that feel heavier than they are. He remembers. So, you find, do you."
      effects:
        - coin: +15
        - reckoning: +3
        - morale: { target: household, amount: -6 }
    - id: feed-the-vat
      text: "Feed them to the Vat."
      requires:
        - has_vat: true
      result: "You put what was a person into the vat-liquor and tell yourself it's only what the trade does. The Vat will make something new of them. The ground has opinions about that. So, in the night, do you."
      effects:
        - reckoning: +6
        - ghost_roll: { add: this }
        - morale: { target: household, amount: -8 }
    - id: full-funeral
      text: "A full funeral — the preacher, the naming, the day."
      cost: { coin: 40, rest_day: true }
      result: "You send for Grange and give the whole day to it, and every hand stands and hears the name said proper into the cold. It costs you a working day and forty marks. It is the difference between a farm and a slaughterhouse, and the household knows you chose it."
      effects:
        - reckoning: -2
        - morale: { target: household, amount: +10 }

- id: bad-blood
  title: "Bad Blood in the Bunkhouse"
  family: personal
  severity: minor
  illustration: "two clones squared off in the bunkhouse doorway, the others watching, a spilled bowl between them"
  setup: >
    Two of the hands have come to hate each other — over a bunk, a chore, a word, nobody quite
    knows anymore — and the whole bunkhouse is sour with it. Left to fester, it splits a
    household right when you need it whole.
  conditions:
    - clones: { min: 3 }
  on_ignore: dismiss
  choices:
    - id: sit-them-down
      text: "Sit them down and settle it."
      cost: { labor: 0.5 }
      result: "You give an hour to hearing them both out and knocking two hard heads toward sense. It half-works, which is as much as these things ever do. The bunkhouse eases."
      effects:
        - morale: { target: household, amount: +2 }
    - id: split-the-work
      text: "Put them on opposite ends of the farm."
      result: "You keep them apart and let the grudge cool on its own. Slower, and the work's a little clumsier for the shuffling, but the fists stay down."
    - id: let-them-fight
      text: "Let them settle it themselves."
      result: "They settle it in the yard, bloody and brief, and one of them works sore for a week. The household picks sides, and the sourness lingers longer than the bruises."
      effects:
        - morale: { target: household, amount: -4 }

- id: the-one-who-sees
  title: "The One Who Sees"
  family: personal
  severity: minor
  illustration: "a clone standing motionless at the edge of a field at dusk, head tilted, listening to nothing"
  setup: >
    One of the hands has started standing at the field's edge at dusk, head cocked, listening
    to something the rest of you can't hear. She's no trouble by day. But she says the ground
    talks in the low field, and lately she's begun to answer it, and the others have started
    to keep their distance.
  conditions:
    - reckoning_tier: { min: warnings }
  on_ignore: dismiss
  choices:
    - id: listen-to-her
      text: "Ask her what the ground says."
      result: "You ask, and she tells you, plain and unafraid, a thing about the low field you did not want to know and cannot now unknow. She may be mad. She may be the most useful hand you have. Out here the difference is thin."
      effects:
        - flag: { set: has-seer, to: true }
    - id: work-her-hard
      text: "Keep her too busy to listen."
      result: "You load her days so full she's no time to stand and hear. It works, after a fashion. But a hand kept from what she sees is a hand you've made afraid of you, and the ground goes on talking whether she answers or not."
      effects:
        - morale: { target: household, amount: -2 }

- id: worn-down
  title: "Worn Down"
  family: personal
  severity: minor
  illustration: "a clone moving stiff and slow at the row's end, a hand pressed to the back, grey in the face"
  setup: >
    You've been driving the hands hard — a hard year asks it — and it's begun to show. One of
    them moves like an old man now, stiff and grey, slower every week. Worked bodies wear out,
    the same as tools, and mend slower.
  conditions:
    - clones: { min: 2 }
  on_ignore: dismiss
  choices:
    - id: ease-off
      text: "Ease off. Let them mend."
      result: "You lighten the load and the worn hand comes back to themselves over a few weeks. You lose a little labor now against losing a hand entire later. It's arithmetic, but it's also a kindness, and both are true."
      effects:
        - morale: { target: household, amount: +2 }
    - id: drive-on
      text: "The work won't wait. Drive on."
      result: "You keep the pace. The body keeps failing. There's a limit to what a worn hand will give before it gives out, and you are teaching yourself exactly where it lies."
      effects:
        - morale: { target: household, amount: -3 }

- id: the-empty-cot
  title: "The Empty Cot"
  family: personal
  severity: major
  illustration: "a made cot at dawn, unslept-in, the bunkhouse door ajar on grey light"
  setup: >
    A cot is made and empty this morning — not taken, not dead, just gone, walked off into the
    dark rather than face another day of your farm. A household worked to the bone and never
    eased loses its hands to the road, one quiet dawn at a time.
  crisis_gate:
    - clones: { min: 1 }
  on_ignore: worst
  choices:
    - id: go-after-them
      text: "Ride out and bring them back."
      cost: { labor: 1.0 }
      result: "You find them on the Dray road, footsore and half-regretting it already, and you ride back beside them saying little. Something is mended by the going after. The others mark that you went."
      effects:
        - morale: { target: household, amount: +4 }
    - id: let-them-go
      text: "Let them go. A hand who'd run is no use."
      result: "You let them go. Maybe it's true that a runner's no use. But an empty cot in the bunkhouse asks a question of every hand who sleeps near it, and the answers, over a hard winter, tend to empty more cots."
      effects:
        - morale: { target: household, amount: -4 }

- id: a-hand-asks
  title: "A Hand Asks"
  family: personal
  severity: minor
  illustration: "a clone standing cap in hand at the porch step, working up to a question, the farmer in the doorway"
  setup: >
    One of the hands comes to the porch of an evening, cap in hand, and takes a while working
    up to it. They'd like a name of their own, they finally say — not the one the Vat gave, a
    real one, one they picked. It's a small thing to ask. It's not a small thing to be asked.
  on_ignore: dismiss
  choices:
    - id: grant-it
      text: "Let them have their name."
      result: "You tell them to choose, and they do, careful, like a man handling something breakable. From that day they answer to it and work the harder for it, and something in the whole household stands a little straighter."
      effects:
        - morale: { target: household, amount: +3 }
    - id: refuse-it
      text: "A vessel keeps the name it's given."
      result: "You tell them the name they have will do. They say 'yes, sir' and go back to the bunkhouse, and the asking is never repeated, by them or by any of the others, who heard how it went."
      effects:
        - morale: { target: household, amount: -3 }

- id: pulled-from-the-cold
  title: "Pulled from the Cold"
  family: personal
  severity: minor
  illustration: "a clone hauling a half-frozen farmer through the snow toward the lit house, both of them near done"
  setup: >
    You went out in the blizzard after a strayed beast and the cold near had you — and it was
    one of the hands who came out into it, roped to the porch, and hauled you back through the
    white to the fire. You'd not be here to reckon the accounts if she hadn't. She says nothing
    of it. But it happened.
  conditions:
    - season: Winter
    - clones: { min: 1 }
  once: true
  on_ignore: dismiss
  choices:
    - id: acknowledge-it
      text: "Thank her, plainly, before the others."
      result: "You say it out loud, in front of the household, what she did and what it cost her to do it. She goes red and waves it off. But a farm where the hands would go into a blizzard for the man who owns them is a farm that will survive most things, and everyone in the room understands why."
      effects:
        - morale: { target: household, amount: +5 }
    - id: say-nothing
      text: "Say nothing. It's a hand's job to serve."
      result: "You let it pass without a word, as though being hauled from death were a chore like any other. She learns what her life was worth to you in that silence. So do the rest of them."
      effects:
        - morale: { target: household, amount: -4 }

- id: the-two-of-them
  title: "The Two of Them"
  family: personal
  severity: minor
  illustration: "two clones sitting close on the bunkhouse step at dusk, shoulders touching, not talking, just being near"
  setup: >
    Two of the hands have taken to each other — you see them on the step at dusk, close, not saying
    much, just being near. The Vat gave them no leave to love anybody. They've gone and done it anyway,
    which tells you something about what you're really growing out there.
  conditions:
    - clones: { min: 3 }
  once: true
  on_ignore: dismiss
  choices:
    - id: leave-them-be
      text: "Leave them be. Let them have it."
      result: "You say nothing and let the two of them have their dusks on the step. A farm where the hands have something to hold onto is a farm that holds together. They work the better for it, and so, somehow, do you."
      effects:
        - morale: { target: household, amount: +3 }
    - id: split-them-up
      text: "Split them across the work. No place for it."
      result: "You put them on opposite ends of the farm, because sentiment slows a crew, or so you tell yourself. They obey. The dusks on the step end. So does something in the whole household's face when it looks at you."
      effects:
        - morale: { target: household, amount: -4 }

- id: wont
  title: "Won't"
  family: personal
  severity: major
  illustration: "a clone standing stock-still in a field, tools down, meeting the farmer's eye and not moving"
  setup: >
    One of the hands has stopped. Not tired — stopped. Stands in the field with the tools down and
    meets your eye and won't move, won't say why, won't be shouted back to work. A hand that defies you
    in front of the others is a crack in the whole crew, and every one of them is watching to see what
    you do with a crack.
  conditions:
    - clones: { min: 2 }
  on_ignore: worst
  choices:
    - id: hear-them-out
      text: "Ask, plainly, what's wrong."
      result: "You put your own tools down and ask. It takes a while, but it comes out — a grievance, a fear, a small hard thing you can actually fix. You fix it. The crew watches a man listen to a hand, and works the harder for having seen it."
      effects:
        - morale: { target: household, amount: +2 }
    - id: make-an-example
      text: "Make an example. The others are watching."
      result: "You break the defiance hard, in front of them all, because a crew must know who holds the whip. It works — the hand goes back to the field. And every other hand learns, watching, exactly what you are, and files it where the ground can read it later."
      effects:
        - morale: { target: household, amount: -8 }
        - reckoning: +1

- id: old-hands
  title: "Old Hands"
  family: personal
  severity: minor
  illustration: "a long-serving clone moving stiff at first light, grey at the temples, slower than the young ones but sure"
  setup: >
    One of your hands is getting old — grey at the temple now, slow to start of a cold morning, not the
    worker he was. He knows it. He works twice as careful to make up for what he's lost in speed, and
    watches your face for the day you decide he's not worth his feed.
  conditions:
    - clones: { min: 2 }
  on_ignore: dismiss
  choices:
    - id: keep-him-on
      text: "Keep him on. He's earned it."
      result: "You put him to the work that wants care over speed — the seed, the tending, the young ones' teaching — and he does it better than any of them. A farm that keeps its old hands is a farm the young ones will stay to grow old on."
      effects:
        - morale: { target: household, amount: +2 }
    - id: sell-him-on
      text: "Sell him to Vane while he's worth anything."
      result: "You sell the old hand to Ambrose before age takes the last of his value. He goes without a word — he saw it coming. The young ones watch him go and do the arithmetic on their own futures, and the doing of it costs you more than the old man's slowing ever did."
      effects:
        - coin: +20
        - morale: { target: household, amount: -6 }
        - reckoning: +2

- id: grief-in-the-bunkhouse
  title: "Grief in the Bunkhouse"
  family: personal
  severity: minor
  illustration: "the hands gathered quiet around an empty cot, one of them holding a dead friend's tin cup"
  setup: >
    One of them died this winter, and the ones left are grieving — quiet, around the empty cot, one of
    them turning a dead friend's tin cup over and over. The Vat grew them to work, not to mourn. They
    mourn anyway. How you meet it tells them whether their own dying will be marked or forgotten.
  conditions:
    - ghost_roll: { min: 1 }
  on_ignore: dismiss
  choices:
    - id: grieve-with-them
      text: "Stop the work. Grieve with them a while."
      result: "You call a halt and stand with them a while at the empty cot, and say the dead one's name, and let the grieving be grief and not weakness. It costs an afternoon. It buys a crew that knows their names will be said too, when it's their turn, and there is no loyalty deeper than that."
      effects:
        - morale: { target: household, amount: +4 }
    - id: back-to-work
      text: "Grief won't bring the harvest in. Back to work."
      result: "You send them back to the field with the cup still warm from a dead hand's grip. They go. They work. And a small door closes behind their eyes that you will never get open again."
      effects:
        - morale: { target: household, amount: -5 }

- id: the-broken-plough
  title: "The Broken Plough"
  family: personal
  severity: major
  illustration: "a snapped plough-blade in the mud, a clone standing over it stricken, the farmer's shadow falling across both"
  setup: >
    A hand has broken the plough — carelessness, or bad iron, or plain hard luck, but it's broken, and
    it's a season's mending or a purse of marks to replace, and the hand who did it stands over the
    wreck of it white-faced, waiting to learn what kind of man you are when a thing goes wrong.
  conditions:
    - clones: { min: 1 }
  on_ignore: dismiss
  choices:
    - id: let-it-go
      text: "It's iron. Iron breaks. Say so and move on."
      result: "'It's iron,' you say. 'Iron breaks.' The hand looks at you like you've handed him something, which you have. A crew that isn't afraid of you for an honest accident is a crew that tells you the truth when it matters."
      effects:
        - morale: { target: household, amount: +2 }
    - id: take-it-out-of-him
      text: "Take it out of his hide, hard."
      result: "You make the hand pay for the iron in a way he'll remember, in front of the others, because a farm can't afford careless hands. He remembers. So does the ground, which does not distinguish as finely as you do between discipline and cruelty, and keeps its own accounts."
      effects:
        - morale: { target: household, amount: -6 }
        - reckoning: +2

- id: a-small-gift
  title: "A Small Gift"
  family: personal
  severity: flavor
  illustration: "a rough-carved wooden bird set on the farmhouse windowsill, a hand walking away not looking back"
  setup: >
    There's a thing on the windowsill this morning — a little bird, rough-carved out of a scrap of
    cottonwood, set there by one of the hands and no note and no name. It's not much. It's the kind of
    not-much a person only makes for someone they've decided is worth the whittling.
  conditions:
    - clones: { min: 1 }
  once: true
  on_ignore: dismiss
  choices:
    - id: keep-it
      text: "Keep it on the sill."
      result: "You leave the little bird on the sill where you can see it, and you never say who gave it and neither do they, and it sits there through every hard season as a small stubborn fact: that on this cruel ground, one grown soul thought another worth the carving."
      effects:
        - morale: { target: household, amount: +2 }

- id: first-day
  title: "First Day"
  family: personal
  severity: minor
  illustration: "a new hand standing awkward in the yard on a first morning, not knowing where to put himself or his hands"
  setup: >
    The new hand stands awkward in the yard his first morning, not knowing where to stand or what to do
    with his hands, watching you the way a dog watches a man it hasn't decided about yet. What you make
    of this first day, he'll carry the shape of for as long as he's yours.
  conditions:
    - clones: { min: 2 }
  once: true
  on_ignore: dismiss
  choices:
    - id: welcome-him
      text: "Show him the place; give him his feet."
      result: "You walk him the farm, name the fields and the other hands, and let him find his feet before you find him fault. He starts the day a wary stranger and ends it a hand, and the difference is a morning of your time and a lifetime of his loyalty."
      effects:
        - morale: { target: household, amount: +2 }
    - id: work-him-cold
      text: "Straight to the field. He'll learn by doing."
      result: "You put him to the hardest work cold, no welcome, and he does it because he must and learns the farm is a thing done to him, not a place he's part of. He'll work. He'll never quite belong. Some part of you meant it that way, and the ground makes note of the meaning."
      effects:
        - morale: { target: household, amount: -2 }

- id: the-hand-who-wont-eat
  title: "The Hand Who Won't Eat"
  family: personal
  severity: major
  illustration: "a full bowl untouched on a bunkhouse table, a hollow-eyed clone turned to the wall, the others exchanging looks"
  setup: >
    One of the hands has stopped eating — turns his bowl away, turns to the wall, wastes to shadow while
    the others watch and don't know what to do. It isn't sickness Doc Bell can name. It's the kind of
    giving-up that takes a soul the Vat grew for work and never taught a reason to keep going. He's
    slipping, and quiet, and quick.
  conditions:
    - clones: { min: 2 }
  on_ignore: worst
  choices:
    - id: give-him-reason
      text: "Sit with him. Find him a reason to stay."
      cost: { labor: 0.5 }
      result: "You sit with him in the dark of the bunkhouse and don't leave until he's talking, and it's slow and it's hard and it works — you find him a small reason, a task that's his, a name said kind, a place. He eats. He stays. It cost you a day and it saved a life, and you'd not have called those a fair trade before you came to the Sull."
      effects:
        - morale: { target: household, amount: +3 }
    - id: let-him-go
      text: "You can't nurse a hand who won't be nursed."
      result: "You tell yourself you can't force a soul to want its own life, and you let him slip, and one grey morning the bowl's still full and the cot's cold. You bury him. The others watched you let it happen, and each of them privately reckons how much fight they'd have in them, the day the Sull comes for their own reason to stay."
      effects:
        - clone: { kill: this, disposal: marked }
        - morale: { target: household, amount: -4 }
