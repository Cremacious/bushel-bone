# Pest events (§9). Threaten crops in the field and food in the store. Treat with labor
# or Doc Bell's remedy (coin), or ignore and risk the spread. Monoculture draws them (§1).

- id: aphids-on-the-wheat
  title: "Aphids"
  family: pests
  severity: major
  illustration: "a wheat-head crawling grey-green with aphids, a clone rubbing them off between finger and thumb"
  setup: >
    The wheat is crawling. Aphids, thick on the heads, come up overnight the way they do in
    a close summer. They don't stop at one field if you let them get a start.
  weight: 12
  conditions:
    - season: [Summer, Fall]
  on_ignore: worst
  choices:
    - id: treat-labor
      text: "Set the hands to it."
      cost: { labor: 2.0 }
      result: "Two days of stoop-work and lye-water clears them off before they spread. Slow, sure, and it costs you the hands you needed elsewhere."
    - id: doc-remedy
      text: "Buy Doc Bell's remedy. (18 marks)"
      cost: { coin: 18 }
      result: "Bell's foul-smelling wash does in an afternoon what labor would take days to do. 'Don't ask what's in it,' he says. You don't."
    - id: ignore-pests
      text: "It's one field. Leave it."
      result: "You leave it, and by week's end the near field is crawling too. One field's problem is the whole farm's, given a week of not minding it."
      effects:
        - crop: { field: this, blight: true }

- id: cutworms
  title: "Cutworms"
  family: pests
  severity: minor
  illustration: "young seedlings toppled at the stem, a fat grey worm curled in the dirt beside one"
  setup: >
    The new seedlings are coming up cut off at the ground: cutworms, working by night, felling
    a row a night if nothing stops them. A collar of ash round each stem turns them, if you've
    the patience for it.
  conditions:
    - season: Spring
  on_ignore: dismiss
  choices:
    - id: ash-collars
      text: "Collar the stems with ash."
      cost: { labor: 1.0 }
      result: "A tedious evening's work saves the stand. The worms move on to a farm that didn't bother."
    - id: replant
      text: "Let them have their fill and replant the gaps."
      cost: { seed: { crop: potato, amount: -4 } }
      result: "You lose some seed and some time to the gaps. Cheaper than the ash-work, if you count only the hours and not the yield."

- id: rats-in-the-granary
  title: "Rats in the Granary"
  family: pests
  severity: minor
  illustration: "chewed sacking, grain spilled in a dark corner, two red eyes at the edge of lamplight"
  setup: >
    There are rats in the granary. You hear them in the walls at night and find the sacking
    chewed by morning. A store is only a store if the rats don't get to it first.
  conditions:
    - has_building: cellar
  on_ignore: worst
  choices:
    - id: set-traps
      text: "Trap them out."
      cost: { coin: 4 }
      result: "Traps and a barn cat and a week of grim mornings clear them. The store holds."
    - id: leave-them
      text: "A few rats never emptied a granary."
      result: "A few rats become many. By the turn of the season you've fed more of your winter store to vermin than you'd like to admit."
      effects:
        - food: { amount: -10 }

- id: the-rot-in-the-roots
  title: "The Rot in the Roots"
  family: pests
  severity: major
  illustration: "a lifted potato black and soft in the hand, the smell of it almost visible"
  setup: >
    You lift a potato to check the crop and it comes apart black and stinking in your hand.
    Root-rot, down in the ground where you can't see it, taking the field from below. Lift
    them now at a loss, or leave them and gamble the whole crop.
  conditions:
    - season: Fall
  on_ignore: worst
  choices:
    - id: lift-early
      text: "Lift the whole field now, sound and rotten together."
      cost: { labor: 1.5 }
      result: "You get the sound ones up before the rot takes them and cull the black by lamplight. A lean harvest, but a real one."
    - id: gamble-it
      text: "Leave them. Maybe it's only the low ground."
      outcomes:
        - odds: even
          result: "It was only the low ground. The rest comes up sound, and you breathe again."
        - odds: even
          result: "It was not only the low ground. The rot runs the whole field, and you lift a harvest of black slime and regret."
          effects:
            - crop: { field: this, blight: true }
            - food: { amount: -8 }

- id: hornworms
  title: "Hornworms"
  family: pests
  severity: minor
  illustration: "a fat green hornworm the length of a finger on a stripped tobacco stalk"
  setup: >
    Hornworms are on the tobacco, great green things the length of your finger, stripping the
    leaf you were counting on selling. They must be picked off by hand, one at a time, which
    is exactly as pleasant as it sounds.
  conditions:
    - season: Summer
  on_ignore: worst
  choices:
    - id: hand-pick
      text: "Pick them off, leaf by leaf."
      cost: { labor: 1.0 }
      result: "A revolting day's work saves the leaf. The hands do not thank you for it, and the crop, at least, is whole."
    - id: let-it-go
      text: "Let them eat. It's only a corner."
      result: "It is not only a corner for long. The worms work through the best of the leaf, and your cash crop is worth a good deal less at market than it was."
      effects:
        - crop: { field: this, blight: true }

- id: the-same-blight
  title: "The Same Field, the Same Blight"
  family: pests
  severity: minor
  illustration: "a tired field, the soil pale and thin, a familiar sickness spreading in the same corner as last year"
  setup: >
    It's the same trouble as last year, in the same field, because you planted the same crop
    in it again. Ground worked too hard breeds its own pests, the old-timers say. The old-timers,
    as usual, are right.
  conditions:
    - field_taint: { min: 0.0 } # placeholder: engine fires this when a field is monocropped (§1)
  on_ignore: dismiss
  choices:
    - id: rest-it
      text: "Rest the field next season."
      result: "You resolve to fallow it and rotate. The ground will thank you, in its slow way. The pests, denied their habit, thin out."
    - id: push-it
      text: "Plant it the same again. It's your best field."
      result: "You push it once more, and the ground pushes back: a poorer crop, a worse infestation, the beginning of a field worked into the ground."
      effects:
        - crop: { field: this, blight: true }

- id: a-cloud-on-the-wind
  title: "A Cloud on the Wind"
  family: pests
  severity: major
  illustration: "a brown shimmer on the horizon that isn't weather, a farmer shading his eyes at it"
  setup: >
    There's a cloud coming on the west wind that isn't a cloud, a shimmer, low and brown and
    seething, that the older hands have seen before and gone quiet at. Locusts. There's an hour,
    maybe, to do anything at all.
  weight: 6
  conditions:
    - season: Summer
  on_ignore: worst
  choices:
    - id: cut-early
      text: "Cut everything ripe enough, right now."
      cost: { labor: 1.5 }
      result: "You scythe like the devil for an hour and get the best of it under cover before the cloud lands. They strip what's left to the stalk. You saved a third. It feels like a victory, which tells you how the day went."
    - id: smoke-them
      text: "Light smudge-fires and try to turn them."
      outcomes:
        - odds: unlikely
          result: "The smoke turns them, just enough. They veer for the Sinks and your fields keep their green. You will burn a candle to your luck tonight."
        - odds: likely
          result: "The smoke does nothing. They come down over everything and rise an hour later off bare dirt. There is no crop this season. There is only next season, if you can reach it."
          effects:
            - crop: { field: this, blight: true }
            - food: { amount: -12 }

- id: weevils
  title: "Weevils"
  family: pests
  severity: minor
  illustration: "a scoop of seed grain shot through with tiny holes, a weevil crawling free of one"
  setup: >
    There are weevils in the seed grain: the holed kernels sift out light and worthless. A stored
    seed-crop is only worth what still sprouts, and less of yours does than did last week.
  conditions:
    - season: [Fall, Winter]
  on_ignore: worst
  choices:
    - id: sift-and-dry
      text: "Sift and dry the seed in the sun."
      cost: { labor: 0.5 }
      result: "A cold afternoon of sifting saves most of the seed. Tedious, thankless, and cheaper than buying seed come spring."
    - id: leave-it
      text: "Leave it. Buy fresh in spring."
      result: "You let the weevils have their fill and resolve to buy seed later. It's more marks than the sifting would have cost you, but it's marks in spring, not sweat now, and that's a trade a tired man makes."
      effects:
        - seed: { crop: wheat, amount: -6 }

- id: grey-mold
  title: "Grey Mold"
  family: pests
  severity: minor
  illustration: "a soft grey fur creeping over stored roots in a dim cellar, spreading faster than mold should"
  setup: >
    A grey mold has got into the cellar and it is spreading faster than any honest damp should, over
    the roots, up the walls, toward the seed. Doc Bell would name the spore. Old Nan would name the
    field it came off. You'd rather not ask either just yet.
  conditions:
    - reckoning_tier: { min: warnings }
    - has_building: cellar
  on_ignore: worst
  choices:
    - id: cull-the-mold
      text: "Cull everything it's touched and scrub the walls."
      cost: { labor: 1.0 }
      result: "You throw out the fouled stores and scour the cellar with lye. The mold retreats. You try not to notice that it came up thickest from the roots grown on the east field."
      effects:
        - food: { amount: -6 }
    - id: scrape-and-hope
      text: "Scrape the worst off and hope it slows."
      result: "You scrape and you hope, and it does not slow. By week's end it has the cellar, and you've lost more than culling early would have cost you, and the smell of it stays in the walls."
      effects:
        - food: { amount: -14 }

- id: potato-beetles
  title: "Beetles"
  family: pests
  severity: minor
  illustration: "striped beetles clustered thick on a potato leaf stripped to the veins"
  setup: >
    Striped beetles have found the potatoes and set to stripping the leaf to lace. Left alone they'll
    have the whole patch and lay eggs for next year besides. Picked and drowned, one bucket at a time,
    they can be stopped.
  conditions:
    - season: Summer
  on_ignore: worst
  choices:
    - id: bucket-them
      text: "Pick them into a bucket, plant by plant."
      cost: { labor: 1.0 }
      result: "A long stooped day and a bucket of drowned beetles saves the patch and thins next year's brood. Nobody grows up dreaming of this work. Everybody who farms out here does it."
    - id: let-them-lace
      text: "Let them have the leaf."
      result: "You leave the beetles to it. The plants soldier on half-eaten and the potatoes come up small and few, and next spring there are twice the beetles waiting."
      effects:
        - crop: { field: this, blight: true }

- id: smut-in-the-grain
  title: "Smut in the Grain"
  family: pests
  severity: minor
  illustration: "a wheat-head swollen black and burst, a smear of sooty spore on a farmer's thumb"
  setup: >
    Smut has got into the wheat: heads swollen black and bursting to soot at a touch, and the wind
    carrying the spore field to field. A crop can look sound at a glance and thresh out half ruin.
  conditions:
    - season: [Summer, Fall]
  on_ignore: worst
  choices:
    - id: rogue-it-out
      text: "Walk the field and pull every smutted head."
      cost: { labor: 1.0 }
      result: "You walk every row pulling the black heads before they burst, hands sooty to the elbow. You save the sound grain and starve the spore. It is the least glamorous salvation there is."
    - id: thresh-and-see
      text: "Thresh it and see what you've got."
      result: "You thresh and find out: half of what looked like a wheat crop is soot and hollow husk. The wind's already carried the rest to next year. You'll be pulling black heads a long time."
      effects:
        - crop: { field: this, blight: true }

- id: mildew
  title: "Mildew"
  family: pests
  severity: flavor
  illustration: "a downy white bloom on the underside of green leaves after a run of wet mornings"
  setup: >
    A run of wet mornings has brought mildew up on the leaves, a downy white bloom on the undersides.
    It's no crisis, this early. A dry spell would burn it off. A wet one would make it your problem.
  conditions:
    - season: [Spring, Summer]
  on_ignore: dismiss

- id: borers
  title: "Borers"
  family: pests
  severity: minor
  illustration: "a corn-stalk split to show the tunneled pith, a pale grub curled inside it"
  setup: >
    Something's boring into the corn-stalks. Split one and you find the tunnel and the grub that made
    it. The stalks snap in a wind, and the ears come small on the ones still standing. There's no easy
    remedy; there's only cutting out the worst and burning the stubble come fall.
  conditions:
    - season: Summer
  on_ignore: worst
  choices:
    - id: cut-and-burn
      text: "Cut the worst stalks and burn the stubble."
      cost: { labor: 0.5 }
      result: "You cut the tunneled stalks for the beasts and mark the field for a hard burning after harvest. It saves what can be saved and thins the brood. Farming is mostly this: small losses, managed."
    - id: ignore-borers
      text: "A few borers won't empty a field."
      result: "A few borers become a field of snapped stalks and small ears. The corn comes in light, and next year's brood is already tunneling in the stubble you didn't burn."
      effects:
        - crop: { field: this, blight: true }

- id: what-grows-in-tainted-ground
  title: "What Grows in Tainted Ground"
  family: pests
  severity: minor
  illustration: "pale, wrong-colored shoots pushing up in a field's tainted corner where nothing was planted"
  setup: >
    Something is coming up in the tainted corner of the east field, pale, wrong-jointed shoots you
    never sowed, in ground where you buried what you buried. It isn't a weed you know. It isn't a weed
    anyone knows. It grows where the ground remembers, and it grows toward the house.
  conditions:
    - field_taint: { min: 0.4 }
  on_ignore: worst
  choices:
    - id: burn-it-out
      text: "Burn it out and salt the corner."
      cost: { labor: 0.5 }
      result: "You burn the pale shoots and salt the ground the old way, and it stops, for now. Old Nan, when she hears, only asks what you put down there. You do not much like answering."
    - id: let-it-grow
      text: "Leave it. It's only a weed."
      result: "You tell yourself it's only a weed and leave it be. It spreads. By season's end the whole corner is pale and wrong and warm to the touch, and nothing you plant near it will take. The ground has decided what grows there now, and it isn't yours to say."
      effects:
        - taint: { field: this, amount: +0.1 }
