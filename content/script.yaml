# Script — every line of narrative dialogue the prototype renders (#46).
#
# This is the single source of truth for the game's writing, laid out like a
# screenplay: one entry per scene (a card beat or event), each holding the
# player-facing prose. Edit here, then run `npm run gen:script` (from prototype/)
# to propagate into prototype/year1.html, which reads each line via L("<id>").
#
# Structural fields (which portrait, which backdrop, resource costs, effects) stay
# in the code, not here. Names resolve through the #45 tokens:
#   {{npc.<id>}} {{npc.<id>.first}} {{term.<id>}} {{place.<id>}} {{loc.<id>}} {{lineage}}
# A few lines have a runtime value spliced in with a single-brace {slot} (e.g.
# {field}); the code fills those when it renders the line.
#
# ids flatten to  <scene>.<field>  and  <scene>.<choiceId>.<field>.
# Export a hand-editable .docx of all this with `npm run script:docx`.
#
# Dialogue intel highlights (economy task 3): when a line of NPC talk carries real,
# actionable intel (not pure flavor), wrap the load-bearing keyword, not the whole
# sentence, in one of five <span class="hl CATEGORY">...</span> classes:
#   hl mkt   market intel, what will sell (gold)
#   hl wx    weather / season warning (blue)
#   hl omen  the reckoning, an omen (red)
#   hl ppl   a person / story thread (green)
#   hl off   an opportunity / offer (lamp accent)
# Styled in prototype2/src/styles/screens.css under `.prose .hl`.

scenes:

  # ---------------- SPRING ----------------

  spring_open:
    eyebrow: "Year One begins"
    title: "Your uncle's ground"
    dir: "[a wagon-rutted road, four fields gone to seed, a lean-to, and a well capped in iron at the property's edge]"
    body: >-
      <div class="prose"><p class="dropcap">The place is yours now, come to you as the nearest blood of an uncle you never met. {{npc.malachi}} worked this ground the better part of twenty years, and what he left when he vanished this past winter comes to no more than the land itself: four small fields the weeds have taken back, a lean-to that sleeps two, a hundred marks, and {{npc.reuben}}, who worked beside him and has stayed on. It is Spring. The larder holds eighty measures against the year, and there is no fuel laid in at all.</p><p>They say the ground here keeps accounts, and your uncle is not here to say how. You will have the year to learn what that can mean.</p></div>
    advance: "Walk the fields"
    advance_sub: "begin the year"

  silas_welcome:
    eyebrow: "A caller · Day 1"
    title: "{{npc.silas.first}}'s Welcome"
    dir: "[a man in a good coat on a poor road, a ledger in his saddlebag, not dismounting]"
    body: >-
      <div class="prose"><p>{{npc.silas}} reins up at your gate and does not get down. <span class="said">“My name is {{npc.silas}}, of the bank in {{place.town}}. I held the paper on this place for your uncle, and now that it has passed to you, I hold it on you.”</span> He says it the way another man might remark on the weather. <span class="said">“A hundred and fifty a year to the bank. The debt came down to you along with the land. Not this year, nor the next: the charter allows a new holder his feet under him. After that it minds its dates, and so will I.”</span> He looks a long moment at the soft ground by the east field, and something crosses his face he does not explain.</p></div>
    choices:
      obliged:
        text: "“Obliged, Mr. {{term.ridley}}.”"
        sub: "keep the peace with your banker"
        result: "He nods and rides off. You are, it seems, a man with a deadline, two years out."
      needle:
        text: "“You believe the stories about this ground?”"
        sub: "needle him; he does not care for it"
        result: >-
          He pauses. <span class="said">“I believe in the ledger,”</span> he says. <span class="said">“The stories are the ledger's business.”</span> He rides off faster than he came.

  fair:
    eyebrow: "The First Furrow · Spring Fair"
    title: "The town turns out"
    dir: "[a green between a white church and a low saloon; the whole of {{place.town}} gathered to bless the planting]"
    body: >-
      <div class="prose"><p>{{npc.halloway}} makes an expansive welcome and presses <span class="hl off">a small wheat contract on you: eight units, at a fair locked price, come the harvest</span>. {{npc.grange}} walks the new man’s fields and says the old words over them. {{npc.meredith}} watches from the saloon step; the Sheriff watches from the shade.</p><p>Attending costs you a working day of {{npc.reuben}}’s, but a newcomer is only new once.</p></div>
    choices:
      attend:
        text: "Attend the Fair"
        sub: "a blessed field, the wheat contract, but {{npc.reuben}} rests today"
        why: "{{npc.reuben}} spends the whole day at your side in town. No field gets tended today, but the wheat contract locks in and the town takes note."
        result: "You stand the day among them. {{term.grange}} walks {field} and says the old words over it{blessing}. The town has seen your face now, and that counts for something in the {{place.region}}."
        blessing: ", and that ground will come ripe a touch sooner for the blessing"
      skip:
        text: "Skip it and work"
        sub: "the town notes the newcomer who wouldn't come"
        why: "{{npc.reuben}} keeps working the fields as usual. You lose nothing today, but {{place.town}} remembers who stayed away."
        result: "You keep to your fields while the fiddles carry across the green. {{place.town}} notices a man who will not sit with it. It always does."

  # ---------------- SUMMER ----------------

  summer_open:
    eyebrow: "Summer · the market opens"
    title: "The long light"
    body: >-
      <div class="prose"><p class="dropcap">The days stretch and the first crops come on. Word reaches you of Regional buyers who send a wagon for a real load, and of the saloon where {{npc.meredith}} sells the one thing dearer than whiskey: knowing things. The heat sits heavy on the fields.</p></div>
    advance: "To work"
    advance_sub: "begin the season"

  vane_wagon:
    eyebrow: "An opportunity · ~Day 25"
    title: "{{term.vane}}'s Wagon"
    dir: "[a black wagon hung with lanterns, and a courteous man who does not quite meet the eye]"
    body: >-
      <div class="prose"><p>{{npc.ambrose}} brings his wagon up the track. Behind the canvas, a shape that breathes. <span class="said">“A grower,”</span> he says, <span class="said">“strong in the ground, gentle with the seed. A hundred and ten marks, and cheap at it.”</span> He can see you counting. <span class="said">“Or a field hand, sixty: a plainer sort of help.”</span></p><p class="note">A second body is a second mouth. It must eat all winter, or it does not last the winter.</p></div>
    choices:
      grower:
        text: "Buy the Grower, 110 m"
        sub: "strong labor; a heavy winter mouth"
        result: "The canvas comes back. She steps down slow, blinking at the light, and does not yet know your name or her own. You will have to feed her now, through everything."
      hand:
        text: "Buy the Field Hand, 60 m"
        sub: "cheaper help; still a mouth to winter"
        result: "Sixty marks, and a plain quiet worker climbs down from the wagon. {{term.vane}} counts the coin twice and is gone before you can ask where such a one comes from."
      haggle:
        text: "Haggle"
        sub: "{{term.vane}} likes to be liked"
        result_won: >-
          He sighs, charmed despite himself. <span class="said">“A hundred, then, for a face I like.”</span> The grower steps down. Ten marks saved, and a mouth to feed.
        result_lost: >-
          <span class="said">“A hundred and ten is the kindness,”</span> he says, and the price does not move. You let the wagon go on.
      decline:
        text: "Decline"
        sub: "one hand, one mouth: the safe winter"
        result: "You let the wagon roll on toward the next homestead. One hand is a lean crew, but a lean crew is a fed crew."

  moral_fork:
    eyebrow: "The fork · late Summer"
    title_harvest: "The Harvest Won't Wait"
    title_cotton: "The Cotton Won't Wait"
    dir: "[a field standing full, a bruise of storm two days out on the horizon, and a hand swaying on his feet]"
    body: >-
      <div class="prose"><p>{field} stands ready, and <span class="hl wx">the forecast reads storm within two days</span>. {{npc.reuben}} has been on his feet since before light and is grey with it. Push him through the night and you save the crop whole. Let him lie down and you lose a third of it to the weather.</p></div>
    choices:
      work:
        text: "Work him through the night"
        sub: "save the crop · {{npc.reuben}} loses heart"
        result: >-
          The crop comes in whole under a black sky. {{npc.reuben}} does not speak for a day. <span class="whisper">The land takes no notice of a hard day, not yet. A hard day is only a hard day.</span>
      rest:
        text: "Let him rest"
        sub: "lose a third · {{npc.reuben}} mends"
        result: "You send him to his cot. The storm takes what it takes. In the morning he works the wet field with something like loyalty, and you find you do not regret the third you lost."

  # ---------------- FALL ----------------

  fall_open:
    eyebrow: "Fall · the scramble"
    title: "Bring it in, and lay it by"
    body: >-
      <div class="prose"><p class="dropcap">The year tips over into taking-in. Every ripe field wants harvesting and the winter wants fuel, and both want the same short days. From here the almanac keeps a running count in the margin: larder against need, wood against the cold.</p></div>
    advance: "Begin"
    advance_sub: "begin the season"

  harvest_home:
    eyebrow: "Harvest Home · the Fall feast"
    title: "The town lights the long tables"
    dir: "[lanterns strung over the green, and {{npc.nan}} at the dark edge of it, watching the newcomer]"
    body: >-
      <div class="prose"><p>Harvest Home falls square in the crunch. {{npc.bess}} asks you one sharp, honest question and reads your face for the answer. {{npc.ruth}} notes how your hands look, fed or not. The Sheriff offers a cool word about soft ground. To go is to lose a working day; to stay away is to be the man who wouldn’t.</p></div>
    choices:
      go:
        text: "Go to the feast"
        sub: "heart mends, a day not worked"
        result: "You sit at the long tables. {{npc.bess.first}} decides something about you; you cannot tell what. It is warm, and there is bread, and for an evening the ground keeps its accounts to itself."
      stay:
        text: "Stay and bring in the crop"
        sub: "the work gets done"
        result: "You work while the fiddles carry over the fields. The crop is safe and the town is a shade cooler to you. You can live on a safe crop; you cannot eat regard."

  sour:
    eyebrow: "An omen"
    title: "Sour"
    body: >-
      <div class="prose"><p class="whisper">The milk turns though the cow is sound and the pail was clean. It turns again the next morning, and the next. When you ask {{npc.nan}} she does not touch it. <span class="said">“You’ve laid something down,”</span> she says, <span class="said">“that the ground did not care for. It remembers the shape of it.”</span></p></div>
    advance: "Say nothing"
    advance_sub: "continue"

  # ---------------- WINTER ----------------

  winter_open:
    eyebrow: "Winter · the crucible"
    title: "The short days close in"
    dir: "[frost on the well-cap; the whole valley gone quiet and white]"
    body: >-
      <div class="prose"><p class="dropcap">Winter in the {{place.region}} is the year’s true test. There is no planting now, only the larder, the woodpile, and the long dark between them. What you laid by is what you have.</p></div>
    advance: "Face it"
    advance_sub: "begin winter"

  ruth_basket:
    eyebrow: "A knock at the door"
    title: "{{npc.ruth}}'s Basket"
    dir: "[a plain woman with a covered basket and a look that misses nothing]"
    body: >-
      <div class="prose"><p>{{npc.ruth}} {{term.grange}} comes up the frozen track with a basket on her arm. <span class="said">“The church keeps a little back,”</span> she says, <span class="said">“for a hard first winter. It is not charity. It is what a town is for.”</span> Her eyes go once around your yard, counting mouths and measuring the fire.</p></div>
    choices:
      accept:
        text: "Accept the basket"
        sub: "a small debt of regard"
        result: "She sets it down and will not stay for thanks. Bread, salt pork, a sack of coal. It is the difference, this year, between a grave and a spring."
      decline:
        text: "“We'll manage, Sister.”"
        sub: "pride; the fire stays low"
        result: >-
          She looks at you a long moment, then nods once and takes the basket back down the track. <span class="said">“The offer keeps,”</span> she says, without turning. You hope you will not need it.

  long_vigil:
    eyebrow: "Midwinter · the longest night"
    title: "The Long Vigil"
    dir: "[the whole town in the church at midnight, every candle lit, an old capped well-head through the open door]"
    body: >-
      <div class="prose"><p>On the longest night the town does not sleep. They fill the church and they watch, and near midnight {{term.grange}} reads the names of everyone who died in the {{place.region}} this year, slow, one by one, so that none is forgotten and left to be. The liturgy does not say <em>taken.</em> Everyone hears it anyway. Outside, past the graves, the old well-head sits under its cap of iron and salt, and the watching is for it.</p></div>
    choices:
      watch:
        text: "Watch the night through with them"
        sub: "the ground eases its accounting"
        result: "You watch. You do not know what you are watching for, and by dawn you understand no one else quite does either, and that they watch anyway. It is the truest thing you have seen in the {{place.region}}."
      home:
        text: "Go home to your fire"
        sub: "keep your own watch"
        result: "You keep your own watch, alone, over your own ground. In the morning the town is a little colder to the man who wouldn't sit the Vigil."

  # ---------------- YEAR-END (the verdict) ----------------
  # The tally rows and the date line are mechanical report labels and stay in code.

  yearend:
    headline: "“I survived another year.”"
    epi: "The frost breaks along the river first. The household wakes to a dripping eave and a thin bright sun, and the year turns over like a page. You made it. Not everyone does."
    lost_none: "The whole household woke to the thaw. Not everyone in the {{place.region}} can say the same."
    lost_some: "The winter took: {names}. The graves are marked; the ground was given its due."
    ground_whispers: "The ground kept its whispers to itself this year: crows and cold spots and nothing worse."
    ground_warnings: "The ground muttered more than whispers this year. It has your measure now, and a longer memory than you."
    ground_walkers: "Something walked the frost this year that should not walk. The {{place.region}} will not forget it, and neither, now, will you."
    codex: "A Vigil is entered in the Codex for the year you survived. Year Two would bring the market’s regional wagon, the Vat, the deeper reckoning, and, in three more years, {{npc.silas}}’s first collected debt."
    again: "Play another first year"
    again_sub: "new seed, new weather, new choices"

  # ---------------- SYSTEMIC EVENTS (drawn one per season) ----------------

  ev_soft_rain:
    eyebrow: "A growing rain"
    title: "A Soft Rain"
    body: >-
      <div class="prose"><p>Three days of soft, warm rain walk up the valley. The seed drinks it in and the fields come on a shade faster than the almanac promised.</p></div>
    choices:
      good:
        text: "Good."
        sub: "the planted fields grow a little faster"
        result: "Everything planted takes a step toward ripe."

  ev_crows:
    eyebrow: "An unfenced field"
    title: "Crows in the Corn"
    body: >-
      <div class="prose"><p>A wing of crows settles on one of your fields and sets to work with a will. There is no fence to turn them.</p></div>
    choices:
      scare:
        text: "Set {{npc.reuben}} to scaring them"
        sub: "a day's labor spent"
        why: "{{npc.reuben}} spends the day at this field, so every other field goes untended today too, not just this one."
        result: "{{npc.reuben}} spends the day waving and shouting. The crows leave insulted; the crop is whole."
      fence:
        text: "Fence it, 15 m"
        sub: "lasting; costs coin"
        result: "Posts and wire go up. The crows try it once, twice, and give it up. The fence will stand for years."
      feed:
        text: "Let them feed"
        sub: "lose a share of that field"
        result: "You let them have their tithe. It is only a share. You will remember the fence come next planting."

  ev_name:
    eyebrow: "A hand asks"
    title: "A Name of His Own"
    body: >-
      <div class="prose"><p>{{npc.reuben}} stands at the door with his hat in his hands and asks, haltingly, whether he might have a name that is <em>his</em>, not the one that came stamped on the charter papers, but one you’d call him by.</p></div>
    choices:
      grant:
        text: "Grant it gladly"
        sub: "he works the harder for it"
        result: "He says the name over twice, quietly, like a thing he is afraid to drop. He works differently after, like a man, not a tool."
      refuse:
        text: "Refuse him"
        sub: "the asking never comes again"
        result: >-
          <span class="said">“As you say,”</span> he answers, and goes back to the field. He does not ask again, and something in him closes for good. <span class="whisper">The ground, somewhere, makes a small note of it.</span>

  ev_hot_wind:
    eyebrow: "A dry heat"
    title: "The Hot Wind"
    body: >-
      <div class="prose"><p>A hot wind comes off the flats and sits on the valley for a week. The work is punishing under it.</p></div>
    choices:
      rest:
        text: "Rest the worst of it"
        sub: "a slow week"
        result: "You keep to the shade through the killing hours. The work waits; the crew keeps its strength."
      work:
        text: "Work straight through"
        sub: "the crop keeps, but {{npc.reuben}} wilts"
        result: "The rows get worked in the full glare. {{npc.reuben}} comes in each night hollow-eyed. The land, for now, takes no notice of a hard week."

  ev_pedlar:
    eyebrow: "A traveller"
    title: "The Pedlar"
    body: >-
      <div class="prose"><p>A pedlar with a swaybacked mule offers cheap seed by the roadside, and, when pressed, something else, wrapped in oilcloth, that he will not name and will not unwrap.</p></div>
    choices:
      buy:
        text: "Buy the seed, 8 m"
        sub: "+8 seed"
        result: "Good seed at a fair price. The oilcloth stays wrapped, and the pedlar goes on his way looking almost relieved."
      send:
        text: "Send him on"
        sub: "want nothing of it"
        result: "You wave him past. The mule complains; the pedlar tips his hat; the oilcloth bundle rides on to trouble someone else."

  ev_rats:
    eyebrow: "In the granary"
    title: "Rats in the Stores"
    body: >-
      <div class="prose"><p>Something has been in the larder. You find the tell-tale spill of grain and the small dark droppings along the wall.</p></div>
    choices:
      trap:
        text: "Trap them, 4 m"
        sub: "stop the loss"
        result: "Traps and a barn cat borrowed from {{npc.bell}}. The stores hold."
      ignore:
        text: "Ignore it"
        sub: "lose food over the season"
        result: "You let it ride. Ten measures of larder go down small throats before the season's out."

  ev_foundling:
    eyebrow: "At the gate"
    title: "A Foundling"
    dir: "[a thin figure at the fence-line at dusk, not quite a child, not quite not]"
    body: >-
      <div class="prose"><p>A stray hand stands at your gate as the light goes, one of the {{place.region}}’ foundlings, grown wild from no wagon and no vat anyone will own to. It watches you and does not speak.</p></div>
    choices:
      take:
        text: "Take them in"
        sub: "free labor, and another winter mouth"
        why: "Another hand works the fields, but winter's food and fuel needs grow to match, for good."
        result: "You open the gate. It comes in like a cat, wary and grateful at once. Free hands in the field, and one more belly to carry to spring."
      ruth:
        text: "Send them to {{npc.ruth}}"
        sub: "+her regard"
        result: "You point the way to the church, where {{npc.ruth.first}} keeps a cot for such as these. She will remember that you sent them fed, not away."
      turn:
        text: "Turn them out"
        sub: "the ground marks it"
        result: >-
          You close the gate. The figure stands a while in the cold, then is not there. <span class="whisper">Something in the ground turns over in its long sleep.</span>

  ev_bell_word:
    eyebrow: "A rumor at the saloon"
    title: "{{npc.bell}}'s Word"
    body: >-
      <div class="prose"><p>{{npc.bell}}, dry as ever, lets fall over a glass that a Regional buyer will pay above the local price for grain this fall, if you have a wagon-load worth carrying, and the coin to wait for the wagon.</p></div>
    choices:
      note:
        text: "Note it and thank him"
        sub: "good to know for Year Two"
        result: "You file it away. The Regional wagon is a Year-Two concern, but the knowing of it is worth a drink, and Bell is worth cultivating."

  ev_early_frost:
    eyebrow: "An early frost"
    title: "Frost on the Low Ground"
    body: >-
      <div class="prose"><p><span class="hl wx">A hard frost comes a week early to the low fields</span>. Anything ripe should come in now or risk the cold.</p></div>
    choices:
      bring:
        text: "Bring in what's ready"
        sub: "safe, but rushed"
        result: "You get the ripe fields in ahead of the white. It is rough work in the cold, but the harvest is safe under roof."

  ev_cabin_fever:
    eyebrow: "The long dark"
    title: "Cabin Fever"
    body: >-
      <div class="prose"><p>The snow shuts the valley in. Days pass without a face from town, and the household grows short-tempered in the close air of the lean-to.</p></div>
    choices:
      keep:
        text: "Keep them busy and fed"
        sub: "if you can spare it"
        result: "You ration out small comforts: a better supper, a task with an end to it. The crew holds together through the worst of the quiet."

  # ---------------- MALACHI'S JOURNALS (#43) ----------------
  # The uncle's almanac-notebooks, canon from narrative-bible §0.11. One entry
  # unlocks per season across Year 1 (spring on arrival, then one each season).
  # His voice is a flat almanac-keeper's; the flatness is the horror.

  journal_spring:
    heading: "The first spring, 1864"
    body: >-
      <p>Signed the charter today. Four fields and a lean-to by the slow river, off a Company man who would not stay for supper. He was gone before the light went.</p><p>The parcel has no name on the roll, only a number. In time it will take mine, I suppose, the way places do.</p><p>The ground is the strange thing. The east field was warm to the hand, though the frost is not a week gone, warm as a fresh loaf. A good sign, the agent said. Quick ground, grows twice for half the labor. He said it the way a man says a thing he has been told to say.</p><p>I have a field to break and no arms but my own to break it. Tomorrow I see about a hand.</p>

  journal_summer:
    heading: "Summer, 1864"
    body: >-
      <p>Bought a hand off the wagon. A field man, strong, slow to speak. {{npc.reuben}}, the merchant called him. I have never held with the way they are made, but a man cannot work four fields with two arms, and I will not pretend otherwise.</p><p>I told him he eats what I eat and sleeps under the same roof until the barn is raised. He looked at me as if I had spoken in some other tongue. Perhaps I had.</p><p>The quick ground gave up potatoes the size of my fist by August. Half a season. I should be gladder of it than I am.</p>

  journal_fall:
    heading: "Fall, 1864"
    body: >-
      <p>First harvest in, and it is a good one. Better than good. Better than the land has any right to give a man who does not yet know what he is doing.</p><p>The crows came for the gleanings and stayed. They are always here now: on the fence, on the well-sweep, on the ridge of the roof. {{npc.reuben}} says they were here before we were.</p><p>An old woman came up the road at dusk and stood at the edge of the east field without setting foot in it. I called a greeting. She did not answer, only looked a long while at the ground, and then at me, and went back the way she came. {{npc.nan}}, the town calls her. I am told to pay her no mind. I paid her some.</p>

  journal_winter:
    heading: "The first winter, 1864"
    body: >-
      <p>Cold such as I have not known. But the east field does not wholly freeze. There is a patch of it, no bigger than a grave, that stays soft and dark clean through, and steams a little at first light, like something taking slow breaths.</p><p>I put my hand to it on the worst night, when the wind was up and sleep would not come. It was warm. I did not care for how warm.</p><p>{{npc.reuben}} found me out there and did not ask what I was about. He only said, <span class="said">“Best come in, Mister {{npc.malachi}}. Ground keeps its own counsel.”</span> I have thought on that since.</p><p>We are alive. That is the whole of the account this year.</p>

  # Reuben's "knew Malachi" thread (#43): a topic on the Ask Reuben panel. He
  # remembers the uncle and grieves him, and points to the journals. Restrained,
  # no spoiler of the Old Well or the sacrifice (the journals reveal that slowly).
  reuben_malachi:
    topic: "Did you know my uncle?"
    reply: >-
      <p>{{npc.reuben}} goes still, and turns his hat over in his hands. <span class="said">“Mister {{npc.malachi}}. Aye. Near twenty year I worked this ground beside him.”</span></p><p><span class="said">“He was the first ever told me I ate what he ate, slept under his roof. I did not know what to make of it, at the first. He waited while I learned.”</span> He is quiet a moment. <span class="said">“He kept a lamp lit over the east field, some nights. Watching, he said, though he would not say for what. The winter he went, he set me to hold the fields till his blood came. Then he was gone, and no grave to show for it, only the books he left on the shelf.”</span></p><p>He looks at you, steadier than his voice is. <span class="said">“Read them, when the pages come to you. He wrote them for whoever would follow. Reckon that is you now.”</span></p>

  # Town talk scenes (Phase B task 6): three NPC intros reachable via the TOWN
  # tab menu (D-042 to D-047 exploration). Each is a single-beat "go_on" card.
  crake_intro:
    eyebrow: "The smithy"
    title: "Hollis Crake"
    body: >-
      <div class="prose"><p>{{npc.crake}} does not stop his hammer at once. When he does, he sets the piece down with the one hand he has and looks you over. “You would be the one took the old {{lineage}} place,” he says. “Ground like that eats tools. When you are ready to work it proper, a plow, a well, a barn raised, you come to me. I do not give credit, mind.”</p></div>
    choices:
      go_on:
        text: "“What should a man watch for, working ground like that?”"
        sub: "take the smith's measure of it"
        result: "“Edges,” he says, without looking up. “Quick ground blunts a blade twice as fast as honest dirt. Keep your tools keen and they keep you. Let them go dull and the work breaks your hands before the season does.” He means it for use, not for talk, and something in him thaws a degree that you asked."

  tolliver_intro:
    eyebrow: "The general store"
    title: "Prudence Tolliver"
    body: >-
      <div class="prose"><p>{{npc.tolliver}} watches your hands more than your face, the way a woman does who has been paid in promises before. “Seed, salt, lamp oil, nails,” she says, naming her shelves without pointing at them. “I carry what a place needs and not one thing it merely wants. Coin on the counter, and we will get on fine. You will find I remember a debt longer than most remember a kindness.”</p></div>
    choices:
      go_on:
        text: "“Then I will start as I mean to go on. Seed, to begin.”"
        sub: "put coin on the counter and mean it"
        result: "She measures out your seed, and then, without a word, tips a small extra handful into the sack and levels it flat. “For paying square the first time,” she says, as near to warmth as she comes. “Do not make me regret the reading of you.”"

  meredith_rumor:
    eyebrow: "The saloon"
    title: "Meredith Vane"
    body: >-
      <div class="prose"><p>{{npc.meredith}} pours for a man who has stopped listening and leans your way instead. “You hear things, keeping a bar,” she says, low. “The rail is hungry for <span class="hl mkt">grain this year</span>, and what the rail wants, the rail pays for, come the depot. <span class="hl mkt">Wheat and corn</span>, if you have the patience to grow them. The roots? Everyone has roots. A <span class="hl mkt">glut on a market</span> is a poor man's harvest.” She straightens. “Worth knowing, when you decide what to put in the ground.”</p></div>
    choices:
      go_on:
        text: "“Who is buying, and what does the depot pay?”"
        sub: "get the figure, not just the notion"
        result: "She names a rail factor by name and the price he is quoting, low enough that you could carry it to the depot yourself and clear a coin on the difference. “That one is free,” she says. “The next costs you a drink.” You pocket the knowing, and a little coin comes of it before the week is out."

  # Town talk scenes, remaining five (town-exploration task 2): the last five
  # townsfolk get their intro, a deeper scene (gated by standing), and a short
  # small-talk filler for when their deck is exhausted. Same shape as above.

  silas_town:
    eyebrow: "The bank"
    title: "Silas Ridley"
    body: >-
      <div class="prose"><p>{{npc.silas}} finds you on the street and does not waste words on greeting. He asks after the fields, the fences, and whether you have kept count of what you owe, in that order, and nothing warmer. When you answer him plain, he nods once, as if a column has been added correctly and no more needs saying. He touches his hat at parting, which from him passes for cordial.</p></div>
    choices:
      press:
        text: "“The year is lean. Could the note not wait a season?”"
        sub: "ask him to bend, and he will not thank you for it"
        result: "The warmth, what little there was, goes out of him. “A note that waits is a note that is never paid,” he says. “I did not lend to your uncle on feeling, and I will not carry you on it. See the date is met.” He touches his hat and leaves you standing, a shade poorer in his eyes than before you spoke."
      civil:
        text: "“The count is kept, Mr. Ridley.”"
        sub: "answer him plain, ask him nothing"
        result: "He nods once, satisfied by the arithmetic of it. “A man who knows what he owes is halfway to paying it,” he says, which from Silas Ridley is nearly a kindness, and he is gone before you can spoil it."

  grange_intro:
    eyebrow: "The church"
    title: "Elias Grange"
    body: >-
      <div class="prose"><p>{{npc.grange}} meets you on the church steps, thin as a fence post and twice as grave. He speaks of the parish roll, of the dead who are owed a Sunday word, and of a duty that does not end at a man's own gate. He asks after your uncle's grave and seems unsurprised there is none to tend. Before you go he says, quiet, that the ground remembers what a man buries in it, and lets the words sit.</p></div>
    choices:
      duty:
        text: "“A man owes more than his own fence line, I have always thought.”"
        sub: "the answer he is listening for"
        result: "For the first time his grave face eases. “Not many say it and fewer mean it,” he tells you. “Your uncle did. You will do, then.” He inclines his head, the nearest thing to warmth he offers, and marks something in his ledger of souls that is not, you think, a debt."
      trade:
        text: "“I will come when the plate is worth the walk.”"
        sub: "make it a matter of profit"
        result: "The ease does not come. “The Lord keeps a poorer ledger than the bank, and a longer memory,” he says, and lets it go at that. He has taken your measure and found the column short."
      shrug:
        text: "“My gate is my own concern, Preacher.”"
        sub: "wave the duty off"
        result: "“So every man says,” Grange answers, unsurprised, “until the ground asks otherwise.” He returns to his register without another word, and you are left unsure whether that was warning or only weariness."

  bell_intro:
    eyebrow: "The doctor's rooms"
    title: "Doc Bell"
    body: >-
      <div class="prose"><p>{{npc.bell}} looks up from a jar of something pickled and says he heard the newcomer had not yet fallen sick or hurt, which he counts a personal failure on the town's part. He asks brief, pointed questions, of the hands, of sleep, of food, of cold, the way a man takes inventory. He writes nothing down when you answer, though you get the sense he forgets nothing either.</p></div>
    choices:
      rest:
        text: "“I watch the one who goes quiet and stops eating.”"
        sub: "answer as a man who has kept people"
        result: "He looks up properly for the first time. “That is the one,” he says. “A hand that grumbles has strength to spare. It is the quiet one, off his food, you bury if you are slow. Rest him at the first of it, not the last.” He tells it to you as a gift, and means it as one."
      drive:
        text: "“A hand that can stand can work.”"
        sub: "give him the hard man's answer"
        result: "He sets down his pen. “Then you will keep me in trade,” he says, dry as salt, “and yourself short a hand come the frost.” He does not argue it further. He has seen the end of that reasoning too many times to bother."
      dose:
        text: "“A dram of whatever is in that jar ought to set most things right.”"
        sub: "make light of it"
        result: "“Most things it makes worse,” Bell says, unamused, and corks the jar. “Come back when you are ready to talk sense. You will be.”"

  coldwater_intro:
    eyebrow: "The jail"
    title: "Nathaniel Coldwater"
    body: >-
      <div class="prose"><p>{{npc.coldwater}} stands in the jailhouse doorway and looks at you the way he looks at everyone, long and unhurried, as if reading a warrant not yet written. He asks how the hands you keep are getting on, and waits out the silence after the question rather than filling it himself. When you answer, he only says he likes to know a man's ground before trouble finds it, then goes back inside without another word.</p></div>
    choices:
      plain:
        text: "“They eat what I eat and sleep dry. Come see for yourself.”"
        sub: "answer him open, with nothing to hide"
        result: "Something in the long stare eases, just. “I may, at that,” he says. “A man who says come look is generally a man worth not looking at twice.” He nods once and lets you go, and you feel the weight of his attention lift a fraction from your back."
      cold:
        text: "“How I keep my hands is my own affair, Sheriff.”"
        sub: "shut the door on the question"
        result: "The stare does not waver. “It is,” he agrees, too easily. “Right up until it is mine.” He steps back inside without another word, and you understand you have moved yourself up some list he keeps, and not toward the top of it in any good way."

  nan_intro:
    eyebrow: "The gate"
    title: "Old Nan"
    body: >-
      <div class="prose"><p>{{npc.nan}} is waiting at the gate when you come out, as if she knew the hour you would. She does not ask your name, only looks past you toward the east field a long moment before speaking. She says the ground has always kept its own accounts, longer than any bank's, and that a body learns to listen or a body learns the hard way. Then she is up the road before you think to ask what she means.</p></div>
    choices:
      listen:
        text: "“Then teach me to listen. I would rather not learn the hard way.”"
        sub: "ask the old woman plainly"
        result: "She studies you a long moment, as if you have surprised her. “The ground under your east field runs a longer account than any book in that town,” she says. “It marks every kindness and every cruelty a body does upon it, and it settles up in its own season. You cannot pay it early and you cannot cheat it. You can only mind what you write there.” Then she is up the road, and you are left with the cold sense that she has told you something true."
      boast:
        text: "“I will manage my own ground, thank you.”"
        sub: "wave the old woman off"
        result: "“Everyone does,” she says, not unkindly, “right up to the year they cannot.” She looks at you a beat longer than you like, then goes on up the road, and does not offer again."
      scoff:
        text: "“Ground keeps no accounts, old woman. Dirt is dirt.”"
        sub: "have none of it"
        result: "She stops. She does not turn all the way round. “Say that standing on the east field come the dark of winter,” she says, “and see do you still believe it.” Then she is gone, and you have made, you feel, a poor start with the one soul in the county who might have warned you."

  meredith_deep:
    eyebrow: "The saloon"
    title: "Meredith Vane"
    body: >-
      <div class="prose"><p>{{npc.meredith}} waits until the bar empties before she says more. She tells you plain that a saloonkeeper hears every debt in {{place.town}} before the bank does, and that yours is spoken of kindly enough, so far. Then, quieter, she asks whether you have had any word from <span class="hl ppl">her brother's wagon</span>, and something in her face goes careful when she says his name. She does not explain herself, and you do not press.</p></div>
    choices:
      go_on:
        text: "“If word comes off that wagon, you will have it from me.”"
        sub: "give her the promise, and mean it"
        result: "The care goes out of her face, replaced by something rarer from a saloonkeeper: trust. “Then we understand each other,” she says. “A body that keeps a confidence is a body I keep one for.” She tells you which nights the depot buyers drink here and loosen their prices, worth the knowing, and you leave a little higher in her regard than you came."

  crake_deep:
    eyebrow: "The smithy"
    title: "Hollis Crake"
    body: >-
      <div class="prose"><p>{{npc.crake}} sets down the shears he is mending and, for once, does not go straight back to work. He tells you, short and flat, that the arm went to a thresher some ten years back, and that a man learns to work around what is gone or he does not work at all. He says your fences are holding better than most newcomers manage, which from him is no small word. Then he picks the shears back up, and the conversation is over.</p></div>
    choices:
      go_on:
        text: "“How does a man work around a thing that is gone?”"
        sub: "meet the hard word with a plain question"
        result: "He is quiet a while, working the iron. “You stop grieving the arm and start knowing the one you kept,” he says at last. “Same with a place. You will lose things on that ground. A crop, a hand, a year. Grieve them too long and you lose the next as well.” It is the most he has said to you, and he does not take it back."

  tolliver_deep:
    eyebrow: "The general store"
    title: "Prudence Tolliver"
    body: >-
      <div class="prose"><p>{{npc.tolliver}} counts your coin twice before she speaks of anything but goods. She tells you, without much softness, that she buried a husband and has kept this store solvent alone since, and that she has no patience left for men who ask for credit and mean charity. She allows, grudging, that you have not asked her for either. It is, from her, near a compliment.</p></div>
    choices:
      dicker:
        text: "“Then might a square customer get a sack of seed a shade cheaper?”"
        sub: "press the small goodwill for a better measure"
        result: "You put it to her, careful, and wait on her answer."
      fair:
        text: "“I will pay your price and not haggle a widow.”"
        sub: "take her measure at her figure"
        result: "She counts your coin, and counts your seed, and this time does not stop at the line. A fair sack and a touch over, for a man who did not try her. She says nothing of it, but the shelf-straightening can wait a moment while she watches you go."
      win:
        result: "She holds your eye, weighing you, then tips the scoop back into the sack a second time. “For not making a show of it,” she says. A good measure of seed, more than the coin bought, and no more said."
      hold:
        result: "“My price is my price,” she says, but there is no edge in it. She fills the sack square and level to the figure she named, a fair measure and not a grain under, and that is that."
      sour:
        result: "Her face closes like a till drawer. “I buried a man, I did not open a charity,” she says. You get your seed, short-measured for the asking, and the sense that the next time you will pay full and be glad of it."

  silas_deep:
    eyebrow: "The bank"
    title: "Silas Ridley"
    body: >-
      <div class="prose"><p>{{npc.silas}} unlocks a drawer and shows you, without preamble, the ledger page in your uncle's account. The payments came regular for years, he says, and then in the last year came early, more than was owed, as if <span class="hl ppl">{{npc.malachi}} meant to clear something ahead of a date only he knew</span>. He closes the drawer before you can look too long, and says only that a man who pays ahead is usually running from something behind. He offers no guess as to what.</p></div>
    choices:
      press:
        text: "“Show me the whole page. What was he running from?”"
        sub: "reach for the ledger, and he will not thank you"
        result: "His hand comes flat on the drawer before yours is halfway across the desk. “This is shown as a courtesy, not surrendered as a right,” he says, cold now. “Your uncle's accounts are your uncle's. Ask the ground, if you must ask something.” He locks the drawer, and you have spent a measure of the little regard he held for you to learn nothing at all."
      respect:
        text: "“A man's reasons are his own. I am obliged for the showing.”"
        sub: "let him keep what he keeps"
        result: "He regards you a moment, and something settles. “He would have said the same,” he tells you, and it is not quite a compliment and not quite not. He locks the drawer gently. You leave knowing no more of the why, but standing a little higher with the one man in town who holds your note."

  grange_deep:
    eyebrow: "The church"
    title: "Elias Grange"
    body: >-
      <div class="prose"><p>{{npc.grange}} shows you the parish register, where the names of the dead run back further than the town's founding, by any honest count. He says a preacher's true work is not the sermon but the accounting, who is owed a grave, who is owed a prayer, who is owed neither and gets one anyway. He asks, not unkindly, whether you pray for your uncle, and does not wait long for an answer before he tells you it would do no harm. Something behind his grave manner looks, for a moment, like fear worn down into habit.</p></div>
    choices:
      pray:
        text: "“I will say a word for him. He is owed that much from his own blood.”"
        sub: "give the preacher what he asks"
        result: "He nods, and the fear worn into his manner eases a little. “Then he is not wholly gone,” Grange says. “A name spoken is a name kept.” He marks something small in the register you do not see, and you leave the steps a fraction lighter in his eyes and, oddly, your own."
      decline:
        text: "“I am not a praying man, Preacher. I will not pretend to be one.”"
        sub: "give him the honest answer, not the wanted one"
        result: "He does not argue it. “Honest, at least,” he says, though the disappointment sits plain on him. “Say it in your own way, then, or do not, but do not let him go unremembered. That is the sin, in the end. Not the wrong prayer. The empty one.” He returns to his register, graver than before."

  bell_deep:
    eyebrow: "The doctor's rooms"
    title: "Doc Bell"
    body: >-
      <div class="prose"><p>{{npc.bell}} pours two fingers of something medicinal and admits, dry as ever, that half his practice these days is <span class="hl omen">fevers no textbook accounts for, and hands that will not stop shaking though nothing ails them plain</span>. He says he keeps his own notes on it, separate from the town's official record, and has not decided who ought to see them. He studies you a moment over his spectacles, the way he studies a wound before deciding how deep it runs, then changes the subject, as if he had said more than he meant to.</p></div>
    choices:
      go_on:
        text: "“If it comes to my place, Doc, what do I look for?”"
        sub: "ask him to arm you against it"
        result: "He decides, then, that you are one who ought to see. “Hands that shake with no fever behind it,” he says. “Ones that will not go near a certain patch of a field and cannot tell you why. Ones that talk to the crows. When you see it, rest them, feed them, keep them warm and close, and send for me before you send for the preacher. Half of what I lose, I lose to men who waited.” He means every word for your use, and thinks the better of you for asking."

  coldwater_deep:
    eyebrow: "The jail"
    title: "Nathaniel Coldwater"
    body: >-
      <div class="prose"><p>{{npc.coldwater}} does not raise his voice, which is somehow worse than if he had. He tells you, plain, that <span class="hl omen">he has walked more than one homestead where a farmer's hands went missing quiet and no one asked after them</span>, and that he means to keep asking regardless whether anyone wants him to. He says the law in {{place.town}} does not much care how a man runs his own ground, but he does, and he wanted that said once, to your face, so no one can claim later he gave no warning. He touches his hat and goes, and you are left certain he meant every word.</p></div>
    choices:
      heed:
        text: "“I hear you. My hands will be here to be counted, every one.”"
        sub: "let the warning land, and answer it square"
        result: "He weighs it, and finds it good. “See that they are,” he says, but the edge is off it now. “I would sooner shake a man's hand than dig round his fence line. You have made that likelier today.” He nods once, and for the first time it does not feel like a warrant being drawn."
      defy:
        text: "“A man may work his own hands as hard as he likes, Sheriff.”"
        sub: "tell him where his law ends"
        result: "“He may,” Coldwater allows, quiet. “And the ground he works them into may have its own opinion, which is above my office.” He touches his hat and goes, and you cannot say why the yard feels colder for the saying of it, only that somewhere a small account has been opened against you that the sheriff will never read."

  nan_deep:
    eyebrow: "The gate"
    title: "Old Nan"
    body: >-
      <div class="prose"><p>{{npc.nan}} takes your hand a moment longer than a greeting requires and turns it over, reading the calluses like a page. She tells you the ground under the east field has always kept what is given it, <span class="hl omen">kindness and cruelty both, and pays each back in its own season and its own coin</span>. She does not say when, or how, only that it has never yet forgotten a debt and does not intend to start with you. Then she lets your hand go and walks on before you can ask her to say it plainer.</p></div>
    choices:
      patient:
        text: "“Then I will work it kindly, and wait on its season.”"
        sub: "answer as she is hoping you will"
        result: "Her grip loosens to something like approval. “That is the whole of the craft,” she says. “Feed the hands that feed the ground, and the ground feeds you long. There is a warmth in your east field that is not the sun's. While it stays no more than warm, you are square with it. Should it ever run to cold in the growing season, or to steam in the dead of winter, come to me the same hour, and do not go out to it alone.” She lets your hand go, and you feel warned and armed at once."
      greedy:
        text: "“Never mind the season. How do I make it pay soon, and pay rich?”"
        sub: "reach for the quick harvest"
        result: "She drops your hand as if it had gone hot. “That is the very asking that ruins men on this ground,” she says. “It will pay you soon and rich, aye, and take the price out of something you did not think to sell.” She turns from you, and you have learned nothing but that you asked the wrong thing of the wrong woman."
      afraid:
        text: "“And if the ground already holds a debt against me?”"
        sub: "ask the frightened question"
        result: "She considers you, not unkindly. “Then you had best hope it is a small one, and pay it forward in kindnesses before it is called,” she says. “No debt on that ground forgives itself. But few are past the mending, if a body starts the mending in time.” She says no more, and is gone up the road before the cold of it fully settles."

  # ─── Third deck cards, unlocked by standing (town.TALKS): one new talk per NPC,
  # the reward of a real friendship. Kinds mixed for variety across the eight.

  meredith_whisper:
    eyebrow: "The saloon"
    title: "Meredith Vane"
    body: >-
      <div class="prose"><p>{{npc.meredith}} closes the shutter on the last of the trade and pours two, not one. “I will tell you a thing about this work,” she says. “Men lie to me across this bar from noon to close, and I have learned to like the ones who do not.” She sets a glass in front of you and does not let go of it yet. “So. Are you going to be one more pretty liar, or are we past that?”</p></div>
    choices:
      truthful:
        text: "“I have nothing worth lying to you about, and no wish to start.”"
        sub: "meet her plain"
        result: "She lets the glass go. “Then we will do,” she says. She tells you which of the town's smiling faces owe money they cannot cover, and whose word at market is good and whose is paint, the sort of knowing that keeps a farm off the rocks. You leave her counting you, at last, among the ones she likes."
      flatter:
        text: "“A woman as sharp as you would catch me at it anyhow.”"
        sub: "turn it into a compliment"
        result: "“There it is,” she says, not unkindly, and drinks. “Smooth as a rail agent.” She talks of nothing much after that, and you understand you have answered the question by dodging it."
      dodge:
        text: "“A man keeps some things to himself. No offense in it.”"
        sub: "give her nothing"
        result: "“None taken,” she says, and means only half of it. She finishes her glass and finds a rag to busy her hands, and the confidence she was near to sharing goes back wherever she keeps it."

  crake_ironwork:
    eyebrow: "The smithy"
    title: "Hollis Crake"
    body: >-
      <div class="prose"><p>{{npc.crake}} nods at a heap of broken iron by your feet, hauled in off the old {{lineage}} place. “Busted share, two bent hinges, a kettle past mending,” he says. “Scrap to you, stock to me. I will give you a fair price and melt it down.” He names a figure with his one hand flat on the anvil. It is fair. It might not be his last word, if a man had the nerve to push a one-armed smith on a price.</p></div>
    choices:
      dicker:
        text: "“Fair, maybe. But you will make three times that off it.”"
        sub: "push him for a better figure, or sour the deal"
        result: "He looks at you a long moment over the iron."
      fair:
        text: "“Your figure is square. Take it.”"
        sub: "the price he named, no quarrel"
        result: "He counts the coin into your hand, even and honest, and hauls the scrap off with his one arm before you can offer to help. “Obliged,” he says, which from him is a paragraph."
      win:
        result: "A short, rusty sound comes out of him that you realize is a laugh. “The nerve on you,” he says, and adds to the figure without further argument. “Do not make a habit of it.” You leave with more coin than the scrap was worth and, somehow, higher in his regard for the asking."
      hold:
        result: "“It is fair, and it is my figure,” he says, and does not move off it an inch. You take the honest price he named at the first, which was never a bad one, and that is the end of the dickering."
      sour:
        result: "His face goes flat as the anvil. “Then haul your rust somewhere else,” he says, and names a figure lower than the first, take it or leave it. You take it, poorer for the pushing, and he does not laugh this time."

  tolliver_account:
    eyebrow: "The general store"
    title: "Prudence Tolliver"
    body: >-
      <div class="prose"><p>{{npc.tolliver}} watches you set your coin down square, the way you always do, and something in her decides. “You have paid honest every time you have crossed this floor,” she says. “I do not forget that any more than I forget the other kind.” She measures your seed, and keeps measuring past the figure you paid. “Consider it laid by against your custom. Do not thank me. Just keep being the sort of man I do not have to watch.”</p></div>
    choices:
      go_on:
        text: "“I will, Mrs. Tolliver. And I do thank you, whether you like it or not.”"
        sub: "take the goodwill, and the seed with it"
        result: "She waves it off and turns to her shelf, but the extra seed stays in your sack, a fair measure over and freely given, which from Prudence Tolliver is worth more than the grain."

  silas_terms:
    eyebrow: "The bank"
    title: "Silas Ridley"
    body: >-
      <div class="prose"><p>{{npc.silas}} sets a fresh page before you, the note rewritten in his careful hand. “You have kept your dates,” he says, “so I will offer terms your uncle never had. Steadier payments, spread longer.” He slides it across. The terms are fair, better than fair. His pen waits. A harder man might see how far the offer could be pushed. A wiser one might know a fair hand when it is dealt him.</p></div>
    choices:
      press:
        text: "“Steadier still, then, and softer. You can carry more than this.”"
        sub: "reach past a fair offer for a better one"
        result: "The pen comes up off the page. “I can,” Silas says, cool. “I choose not to. I offered you a kindness and you have tried to weigh it for more, which tells me what sort of debtor you mean to be.” He takes the page back and writes the plain terms instead. You have the note you had, and less of his good opinion than you walked in with."
      accept:
        text: "“That is a fairer hand than I looked for. I will take it, and keep my dates.”"
        sub: "know a fair offer when you are dealt one"
        result: "He nods, as if a sum has come out clean. “See that you do,” he says, and signs, and for once the parting touch of his hat has something behind it. A man who holds your note thinking well of you is worth more than the coin it saved you, and you know it walking out."

  grange_parish:
    eyebrow: "The church"
    title: "Elias Grange"
    body: >-
      <div class="prose"><p>{{npc.grange}} finds you at the churchyard wall and, unasked, tells you a thing he has told few. “Your uncle came here his last winter,” he says. “Not to pray, quite. To ask what a man owes the ground he is buried in, when there is no grave.” The preacher's grave calm thins, and the old fear shows through. “I had no answer for him then. I have thought on little else since. If it should ever come to you the same way, do not carry it alone as he did. My door is open, and the Lord's, whatever you believe of either.”</p></div>
    choices:
      go_on:
        text: "“I will remember that, Preacher. Thank you.”"
        sub: "take the open door for what it is"
        result: "He nods, and something eases in him that has been wound tight a long while, as though the saying of it aloud has shared a little of the weight. You leave the churchyard knowing you have one more door in this hard county that will open when you knock, and higher, quietly, in the parish's regard."

  bell_notes:
    eyebrow: "The doctor's rooms"
    title: "Doc Bell"
    body: >-
      <div class="prose"><p>{{npc.bell}} turns his private book toward you and taps a page. “A hand, another man's, brought to me last fall,” he says. “Shaking, off his food, would not sleep, and no fever in him to blame it on. The farmer swore he fed and rested the man fair. I have my own notion. What is yours?” He watches you the way he watches a wound, to see how deep you read.</p></div>
    choices:
      cold:
        text: "“Worn past mending and left too long, whatever the farmer swore.”"
        sub: "read it as a body used up"
        result: "He closes the book. “That is my notion too,” he says. “A hand can be fed and still be spent, if a man works him to the bone and calls it fair. The shaking is the last of it, not the first.” He tells you the earlier signs to catch, the ones that come weeks before the shaking, and you leave knowing how to keep a hand off this page of his book."
      hunger:
        text: "“Starved, plain and simple. The farmer is lying about the feeding.”"
        sub: "call it hunger"
        result: "“Maybe,” Bell allows, “but the man was not thin, and hunger shows on the frame. No. It was something else, and you have gone for the easy answer.” He does not tell you the hard one, not today."
      haunt:
        text: "“That is no sickness for a doctor. That is the ground's work.”"
        sub: "name the thing outright"
        result: "His face shutters. “I keep this book in plain ink for a reason,” he says, low. “I do not write that word, and I would thank you not to say it in these rooms.” He turns the page back to himself, and the confidence closes over."

  coldwater_line:
    eyebrow: "The jail"
    title: "Nathaniel Coldwater"
    body: >-
      <div class="prose"><p>{{npc.coldwater}} speaks of a neighbor of yours, an older man, hard on the hands he keeps. “Two have gone off his place this year and no one has seen them since,” the sheriff says. “I cannot move on a thing I cannot witness. But a man whose ground lies next to his might see what I cannot.” He lets it sit. “I am asking, plain. If it comes to it, will you tell me true what you see over that fence line?”</p></div>
    choices:
      decent:
        text: "“If I see a man used to death, Sheriff, you will hear it from me.”"
        sub: "stand with the law, and the ones who cannot speak"
        result: "He holds out his hand, which you did not expect, and you take it. “Then there are two of us watching,” he says. “That is one more than there was.” He means it as thanks, and you leave the jail feeling, for once, on the right side of that long stare."
      hard:
        text: "“A man's hands are his own to break, Sheriff. I keep out of it.”"
        sub: "look the other way over the fence"
        result: "The sheriff's face does not change, but something in the room cools. “His own to break,” Coldwater repeats, quiet, as if filing it. He lets you go without another word. Walking home past the neighbor's silent fields, you feel a weight settle that is not the sheriff's judgment, but something older, that keeps its own count of who looked away."

  nan_riddle:
    eyebrow: "The gate"
    title: "Old Nan"
    body: >-
      <div class="prose"><p>{{npc.nan}} is at the gate again, and this time she puts a question to you before you have said a word. “You have worked it a while now,” she says. “So tell old Nan. Of all a body does to that ground, giving, taking, or only leaving it be, which does it remember longest, and pay back surest?” Her eyes do not leave your face while you find the answer.</p></div>
    choices:
      giving:
        text: "“What is given it. The kindnesses keep longest.”"
        sub: "answer as a man who has learned the ground"
        result: "She smiles, slow. “There is the pupil,” she says. “Aye. A cruelty it collects on hard and soon, but a kindness it keeps like seed, and gives back years on, when you have long forgot the sowing. That is the whole secret, and you had it in you already.” She tells you a small sign to read the east field's temper by, and sends you home the wiser."
      taking:
        text: "“What is taken from it. It settles the theft first.”"
        sub: "answer from the gut"
        result: "She tilts her head. “You are not wrong that it settles a theft,” she says, “but you have named the fear and missed the mercy. A ground that only punished would have swallowed this whole county long since. Think on what it keeps, not only what it collects.” She is a shade cooler with you for the missing of it."
      waiting:
        text: "“Nothing, if a man leaves it be and asks nothing of it.”"
        sub: "answer safe"
        result: "“No such thing as leaving that ground be,” she says. “To hold it is to owe it, one way or the other. The man who thinks he asks nothing is only a man who has not yet been sent the bill.” She lets it go at that, neither warmed nor soured, and turns back to the roadside."

  meredith_small:
    eyebrow: "The saloon"
    title: "Meredith Vane"
    body: >-
      <div class="prose"><p>{{npc.meredith}} wipes down the bar and allows there is nothing worth the telling today. “Quiet season,” she says. “I will let you know the moment that changes.”</p></div>
    choices:
      go_on:
        text: "“Obliged, all the same.”"
        sub: "leave her to the bar"
        result: "She lifts a glass in something like a toast and goes back to her pouring."

  crake_small:
    eyebrow: "The smithy"
    title: "Hollis Crake"
    body: >-
      <div class="prose"><p>{{npc.crake}} nods you a greeting without breaking his hammer's rhythm. Nothing new at the forge today, only iron and the work it takes.</p></div>
    choices:
      go_on:
        text: "“I will not keep you from it.”"
        sub: "leave the smith to his iron"
        result: "He is already back at the anvil before the door swings shut."

  tolliver_small:
    eyebrow: "The general store"
    title: "Prudence Tolliver"
    body: >-
      <div class="prose"><p>{{npc.tolliver}} counts her till and spares you half a nod. “Shelves are stocked, accounts are square,” she says. “Come back when you need something.”</p></div>
    choices:
      go_on:
        text: "“I will, Mrs. Tolliver.”"
        sub: "take your leave of the counter"
        result: "She has already turned back to her ledger, pencil moving."

  silas_small:
    eyebrow: "The bank"
    title: "Silas Ridley"
    body: >-
      <div class="prose"><p>{{npc.silas}} passes you on the street and touches his hat, brief and correct. “The ledger has nothing new to say of you today,” he says, and keeps walking.</p></div>
    choices:
      go_on:
        text: "“Good day, Mr. Ridley.”"
        sub: "let him go on his way"
        result: "He is already three doors down, hat set square, minding his dates."

  grange_small:
    eyebrow: "The church"
    title: "Elias Grange"
    body: >-
      <div class="prose"><p>{{npc.grange}} is sweeping the church steps and pauses only long enough to nod. “No burying today,” he says. “Small mercies.”</p></div>
    choices:
      go_on:
        text: "“Small mercies, Preacher.”"
        sub: "agree and move on"
        result: "He returns to his sweeping, unhurried, as though the churchyard had all the time there was."

  bell_small:
    eyebrow: "The doctor's rooms"
    title: "Doc Bell"
    body: >-
      <div class="prose"><p>{{npc.bell}} is cleaning a lens when you pass his window. He raises two fingers in greeting, dry as ever. “Nothing catching today,” he says. “Come back if that changes.”</p></div>
    choices:
      go_on:
        text: "“I will hold you to that, Doc.”"
        sub: "take him at his word"
        result: "He goes back to his lens without looking up again."

  coldwater_small:
    eyebrow: "The jail"
    title: "Nathaniel Coldwater"
    body: >-
      <div class="prose"><p>{{npc.coldwater}} is leaning in the jailhouse doorway, watching the street the way he watches everything. He gives you a long look and a short nod, and says nothing at all.</p></div>
    choices:
      go_on:
        text: "“Sheriff.”"
        sub: "nod back and keep walking"
        result: "He watches you the whole way up the street. You can feel it between your shoulders."

  nan_small:
    eyebrow: "The gate"
    title: "Old Nan"
    body: >-
      <div class="prose"><p>Old Nan is at the roadside picking something small and green. She does not look up. “Ground's quiet today,” she says. “That will not last.”</p></div>
    choices:
      go_on:
        text: "“I will keep that in mind.”"
        sub: "leave her to her picking"
        result: "She only hums something wordless and keeps to her work."

  # Event scenes (v0.4 phase 3, task 3): the starter deck of seven-family events.
  # Mechanics (choices + fx) live in prototype2/src/content/scenes.js; this is
  # the matching prose. Rendered through the scene renderer like a town-talk
  # scene, but returns to the run instead of the town menu.

  ev_fox:
    eyebrow: "The coop"
    title: "A fox in the night"
    body: >-
      <div class="prose"><p>A fox has been at the coop two nights running. You find feathers in the yard and a hen gone. Sit a hand up with a lantern and it costs them a hard night, or leave it be and lose more of the larder to its teeth.</p></div>
    choices:
      chase:
        text: "Sit up for it"
        sub: "a hand loses a night to the watch"
        result: "The hand keeps the lantern lit till dawn and the fox does not come again. They are grey-faced by morning."
      leave:
        text: "Leave it to the dark"
        sub: "the larder pays for the sleep"
        result: "In the morning another hen is gone, and a good measure of the larder with it."

  ev_frost_snap:
    eyebrow: "The sky"
    title: "An early frost"
    body: >-
      <div class="prose"><p>Old Nan was right. A <span class="hl wx">hard frost comes early</span> this year, and the woodpile will not carry the cold at this rate. Set the crew to the axe now, or trust what you have and hope for a short winter.</p></div>
    choices:
      chop:
        text: "To the axe, all of you"
        sub: "wood laid in, but it wears the crew"
        result: "The crew swings till their arms shake and the woodpile grows. It cost them dearly."
      gamble:
        text: "Trust the pile"
        sub: "a gamble on a short winter"
        result: "You bank on the weather turning. It does not, and the woodpile burns down faster than it should."

  ev_good_rain:
    eyebrow: "The sky"
    title: "A soft rain"
    body: >-
      <div class="prose"><p>A <span class="hl wx">warm rain comes</span> just when the ground wanted it. The forage greens along the fence line and the crew brings in more than expected. A rare kindness from the sky.</p></div>
    choices:
      glad:
        text: "Thank the sky"
        sub: "a little extra on the table"
        result: "The larder is fuller than it has any right to be. You do not question it."

  ev_peddler:
    eyebrow: "The track"
    title: "A peddler's cart"
    body: >-
      <div class="prose"><p>A peddler's cart stops at your gate, wheels caked with the mud of the low country. He has <span class="hl off">seed to sell, cheap</span>, more than the store would give for the coin. His eyes do not quite meet yours.</p></div>
    choices:
      buy:
        text: "Buy his seed"
        sub: "coin for a good store of seed"
        result: "You count out the coin and he hands over the sacks. He is gone down the track before you think to check them, but the seed is sound."
      pass:
        text: "Wave him on"
        sub: "keep your coin"
        result: "He shrugs and clucks to his horse, and the cart creaks away."

  ev_sick_hand:
    eyebrow: "The bunk"
    title: "A hand takes ill"
    body: >-
      <div class="prose"><p>One of the crew is down with a <span class="hl omen">fever and a shake</span> in the hands. Doc Bell would see to them, for coin. You could rest them and let it pass, losing their work. Or drive them back to the field and hope it is nothing.</p></div>
    choices:
      doc:
        text: "Send for Doc"
        sub: "coin for the doctor's care"
        result: "Doc comes, leaves a bitter draught, and takes his fee. By the next day the shake has eased."
      rest:
        text: "Rest them"
        sub: "their work lost, their strength back"
        result: "You let them lie abed. The fever breaks on its own and they rise the stronger for the rest."
      work:
        text: "Work them through it"
        sub: "push them, and they may not last a hard week"
        result: "They keep to the field, grey and swaying, and the fever burns worse for it. It cost them more than it saved."

  ev_gate_child:
    eyebrow: "The gate"
    title: "A child at the gate"
    body: >-
      <div class="prose"><p>A child stands at the fence-line at dusk, thin and silent, no folk in sight. Take them in and there is another mouth at the table, but in time another pair of hands. Or turn them back to the road, and carry what that does to you.</p></div>
    choices:
      take:
        text: "Take them in"
        sub: "a mouth now, a hand in time"
        result: "You give the child a place by the fire. The larder stretches thinner, but the household is one more."
      turn_away:
        text: "Turn them back"
        sub: "the road, and what it costs you"
        result: "You send the child on. The gate stays shut a long while after, and something in the ground seems to take note."

  ev_blight:
    eyebrow: "The field"
    title: "Blight in the rows"
    body: >-
      <div class="prose"><p>A <span class="hl omen">grey rot</span> shows on the leaves in one of the fields, spreading down the rows. Buy what the store has to check it, for coin, or cut your losses and let that field go.</p></div>
    choices:
      treat:
        text: "Treat the rows"
        sub: "coin to save the crop"
        result: "You dust the rows with what the store had. The rot slows, and the field is saved, mostly."
      lose:
        text: "Let it go"
        sub: "the field's food lost"
        result: "You leave it. The rot takes what it wants, and the field gives up little at harvest."

  ev_omen_field:
    eyebrow: "The east field"
    title: "The ground, wrong"
    body: >-
      <div class="prose"><p>The <span class="hl omen">east field feels wrong underfoot</span>, warm where it should be cold, and the crows will not light on it. Old Nan would know a rite to ease it, for a small price. Or you can tell yourself it is nothing.</p></div>
    choices:
      heed:
        text: "Send to Old Nan"
        sub: "a small price for the old rite"
        result: "Nan comes at dusk, mutters over the field, and salts its corners. The wrongness settles, for now."
      shrug:
        text: "It is nothing"
        sub: "leave the ground be"
        result: "You tell yourself it is the weather. The crows still will not light there, and the feeling does not pass."

  ev_crows_seed:
    eyebrow: "The sown ground"
    title: "Crows on the seed"
    body: >-
      <div class="prose"><p>A black company of crows has come down on the fresh-sown ground, walking the rows and taking the seed before it can root. Set a hand to run them off and stand the watch, or let them have their fill and count the loss.</p></div>
    choices:
      scare:
        text: "Run them off"
        sub: "a hand wears a day at the watch"
        result: "The hand walks the rows with a rattle and a shout till the crows give it up. The seed is saved. It is tiring work, and thankless."
      let_be:
        text: "Let them feed"
        sub: "some of the seed lost to their beaks"
        result: "You leave the birds to it. By dusk a measure of the seed is gone down their throats, and the rows will come up thin."

  ev_dry_spell:
    eyebrow: "The dry weeks"
    title: "A dry spell"
    body: >-
      <div class="prose"><p>The <span class="hl wx">rain has not come in weeks</span> and the ground cracks pale between the rows. Set the whole crew to hauling water from the well to hold the crop, or trust the sky to break and spare them the labor. If it does not break, the field will suffer for it.</p></div>
    choices:
      haul_water:
        text: "Haul water, all of you"
        sub: "the crop held, but it wears the crew"
        result: "The crew carries pail after pail from dawn to dark. The rows hold their green. It costs every back a day of ache."
      wait:
        text: "Wait on the sky"
        sub: "a gamble on rain that may not come"
        result: "You bank on the weather turning. It stays dry, and the field wilts. The larder comes up short at harvest for it."

  ev_buyer_rumor:
    eyebrow: "Word from town"
    title: "A buyer, paying well"
    body: >-
      <div class="prose"><p>Word comes off the road that a <span class="hl mkt">buyer at {{place.town}} is paying well</span> for what a farm can spare, but only for a day or two. Send a hand in with a load to catch the price, or let it pass and keep them to the fields.</p></div>
    choices:
      ride_in:
        text: "Send a hand in"
        sub: "a little coin, and a day off the fields"
        result: "The hand rides in, sells what could be spared, and comes back with the coin in a knotted rag. A long day on the road for it."
      stay:
        text: "Let it pass"
        sub: "keep the crew to the work"
        result: "You let the rumor go by. There is always a buyer, and always the fields wanting hands."

  ev_still_well:
    eyebrow: "The {{place.well}}"
    title: "A sign at the well"
    body: >-
      <div class="prose"><p>The iron cap on the <span class="hl omen">{{place.well}}</span> at the property's edge is beaded with wet, though there has been no rain, and the crows have laid a ring of small stones on it that no crow should. The cap holds, as it has always held. Still, the yard is quieter near it than it was. You could set a small care there, or turn your back and say nothing of it.</p></div>
    choices:
      tend:
        text: "Tend the sign"
        sub: "a small offering, a quiet word"
        result: "You clear the stones, set a little something by the cap, and speak low over it. Nothing changes that you can see. The quiet stays, but it sits easier."
      ignore:
        text: "Turn your back"
        sub: "leave it to the iron"
        result: "You leave the cap to itself and walk back to the house. The stones are gone by morning, and you do not ask where. Something under the iron seems to have marked that you passed it by."

  # Town odd-jobs (v0.4 phase 4D task 2): each a real tradeoff. Mechanics (choices + fx,
  # and the haggle roll) live in prototype2/src/content/scenes.js; these return to the
  # Town screen once closed. Two weigh coin against a hand's wear; two weigh a fuller fee
  # against decency or the reckoning; one is a haggle with win/hold/sour outcomes.

  job_haul_mill:
    eyebrow: "The saloon"
    title: "Grain for the mill"
    body: >-
      <div class="prose"><p>{{npc.meredith}} leans across the bar. The miller wants sacks hauled from the wagons to the loft, and there is <span class="hl off">coin in it</span> for a strong back. Send a hand for the full day and take the whole fee, or work them a half and go easy. The full day pays double, but the stairs are steep and the sacks are heavy.</p></div>
    choices:
      all_day:
        text: "The full day"
        sub: "the whole fee, and it wears a hand hard"
        result: "Your hand hauls from the noon bell to dark. The miller counts out the full sum, and your hand can barely lift the coin, let alone the last sack."
      half_day:
        text: "A half day"
        sub: "half the fee, easy on the hand"
        result: "Your hand works till mid-afternoon and calls it. Less coin in the pocket, but they walk home with something still in their legs."

  job_load_wagon:
    eyebrow: "The smithy"
    title: "Loading the wagon"
    body: >-
      <div class="prose"><p>{{npc.crake}} needs his wagon loaded and strapped, ironwork and tools bound for the outlying farms. He nods at the pile with his one good arm. Load it full and heavy for the <span class="hl off">better fee</span>, or load it light and spare the hand who does the lifting.</p></div>
    choices:
      load_full:
        text: "Load it full"
        sub: "the better fee, and it wears a hand hard"
        result: "Your hand stacks and lashes till the axles sit low. {{npc.crake}} grunts his approval and pays the full sum. The lifting took its toll."
      load_light:
        text: "Load it light"
        sub: "less coin, easy on the hand"
        result: "Your hand loads what is easy and leaves the rest. Less coin for it, but their back is whole at the end of the day."

  job_sit_patient:
    eyebrow: "The doctor's rooms"
    title: "A night at the sickbed"
    body: >-
      <div class="prose"><p>{{npc.bell}} needs someone to sit the night with a patient down with fever, to fetch water and mark the breathing. It is his fee for the whole night. You could see it through till the doctor comes at dawn, and the town would note the kindness. Or you could take the fuller fee and slip off once the patient sleeps, and no one the wiser. No one but you.</p></div>
    choices:
      stay:
        text: "See it through"
        sub: "a fair fee, and the town notes it"
        result: "You sit till the grey light and hand the patient back to {{npc.bell}} breathing easy. He says little, but word of it goes round the {{place.town}} by noon."
      slip_off:
        text: "Take the fuller fee and go"
        sub: "more coin, and a cold thing done"
        result: "You wait till the fever-sleep takes them and let yourself out. You keep the fuller fee. The patient held through the night alone, and you do not ask how close it came."

  job_mend_fence:
    eyebrow: "The rival's line"
    title: "Mending the fence"
    body: >-
      <div class="prose"><p>{{npc.ostrander}} wants a broken stretch of his fence mended, and he names a price before you have set down your tools. It is a fair enough sum. But the man is close with his coin, and there may be more in his purse if you press him for it. Push for the better price, or take the sum he offered and be done.</p></div>
    choices:
      dicker:
        text: "Push for more"
        sub: "chance a better price, or sour him"
        result: "You work the price with him."
      fair:
        text: "Take his offer"
        sub: "the sum he named, no quarrel"
        result: "You take the coin he offered and mend the line clean. He watches the work, finds no fault, and that is that."
      win:
        result: "{{npc.ostrander}} chews on it, then allows you have the right of it. He counts out the higher price and grumbles the whole time."
      hold:
        result: "{{npc.ostrander}} holds to his first figure and will not be moved. You take the sum he named at the start and leave it there."
      sour:
        result: "{{npc.ostrander}} takes it hard, calls you grasping, and cuts the fee for the trouble. You mend his fence for less than he offered, and he will remember the asking."

  job_dig_grave:
    eyebrow: "The churchyard"
    title: "Grave work"
    body: >-
      <div class="prose"><p>{{npc.grange}} has a grave wants digging, quiet work at the edge of the churchyard. Do it slow and square and the <span class="hl omen">ground rests easier</span> for it, though the fee is small. Or dig it fast and careless and take the fuller pay, and trust that no one counts the corners. The land counts the corners.</p></div>
    choices:
      decent:
        text: "Dig it right"
        sub: "less coin, and the ground rests easier"
        result: "You cut it square and deep and fill it clean. {{npc.grange}} pays what little he has, and the churchyard is quiet the way a churchyard should be."
      quick:
        text: "Dig it fast"
        sub: "the fuller pay, done careless"
        result: >-
          You take the shortcuts and the fuller coin. The fill sits uneven and the corners are wrong, and something in the <span class="hl omen">ground takes note</span> of the haste.

  # --- The clone reveal (Phase 4E) ---
  reuben_hands:
    eyebrow: "The lean-to"
    title: "Too much ground for two"
    body: >-
      <div class="prose"><p>{{npc.reuben}} finds you at the fence and does not soften it. <span class="said">"Four fields and the two of us. I have done the sum a hundred times and it comes out the same. We want hands, and we want them before the weeds do."</span> He looks off toward the road. <span class="said">"There is a man keeps a wagon in town. {{npc.ambrose}}. He deals in help, and he comes dear, and he comes quick. I will say no more of him than that. Go and see for yourself."</span></p></div>
    choices:
      go_on:
        text: "Ride in and see him"
        sub: "ask in town about hands"
        result: "Reuben watches you to the gate and says nothing more. The road to the Cross is short, and the wagon is not hard to find."
  vane_reveal:
    eyebrow: "The property track"
    title: "What the wagon carries"
    dir: "[a black wagon hung with lanterns, the canvas drawn close, and a courteous man who does not quite meet the eye]"
    body: >-
      <div class="prose"><p>You came for hired help. {{npc.ambrose}} meets you beside a black wagon hung with cold lanterns, courteous, his eyes going everywhere but yours. Behind the canvas, a shape that breathes. He draws it back without ceremony.</p><p>A woman. She steps down slow, blinking at the daylight like a thing new to it, and she does not know your name, or her own, or how she came to be standing in the road. She has the look of a person and none of the history of one. <span class="said">"Grown, not born,"</span> {{npc.ambrose}} says, gentle as a man selling cloth. <span class="said">"Strong in the ground. She will want feeding, same as you or I."</span> He speaks of her the way a man speaks of stock.</p><p class="note">The ground under your boots is very quiet, the way it goes quiet when it is listening.</p></div>
    choices:
      fair:
        text: "Whatever the making, she is a person"
        sub: "you will deal with her as one"
        result: "You meet her eyes and hold them until she is the one to look away. Whatever she was grown for, she is a person standing in the cold, and you decide, standing there, to treat her as one. The quiet in the ground eases, a little."
      stock:
        text: "Bought and fed, and nothing more"
        sub: "a body, and a winter mouth"
        result: >-
          You look at her the way {{npc.ambrose}} does, as a body and a mouth and a sum of labor. It is easier that way, and cheaper. Something in the <span class="hl omen">ground marks it down</span>, and does not forget.
