# Script — every line of narrative dialogue the prototype renders (#46).
#
# This is the single source of truth for the game's writing, laid out like a
# screenplay: one entry per scene (a card beat or event), each holding the
# player-facing prose. Edit here, then run `npm run gen:script` (from prototype/)
# to propagate into prototype/year1.html, which reads each line via L("<id>").
#
# Structural fields (which portrait, which backdrop, resource costs, effects) stay
# in the code, not here. Names resolve through the #45 tokens:
#   {{npc.<id>}} {{npc.<id>.first}} {{term.<id>}} {{place.<id>}} {{loc.<id>}} {{lineage}}
# A few lines have a runtime value spliced in with a single-brace {slot} (e.g.
# {field}); the code fills those when it renders the line.
#
# ids flatten to  <scene>.<field>  and  <scene>.<choiceId>.<field>.
# Export a hand-editable .docx of all this with `npm run script:docx`.
#
# Dialogue intel highlights (economy task 3): when a line of NPC talk carries real,
# actionable intel (not pure flavor), wrap the load-bearing keyword, not the whole
# sentence, in one of five <span class="hl CATEGORY">...</span> classes:
#   hl mkt   market intel, what will sell (gold)
#   hl wx    weather / season warning (blue)
#   hl omen  the reckoning, an omen (red)
#   hl ppl   a person / story thread (green)
#   hl off   an opportunity / offer (lamp accent)
# Styled in prototype2/src/styles/screens.css under `.prose .hl`.

scenes:

  # ---------------- SPRING ----------------

  spring_open:
    eyebrow: "Year One begins"
    title: "Your uncle's ground"
    dir: "[a wagon-rutted road, four fields gone to seed, a lean-to, and a well capped in iron at the property's edge]"
    body: >-
      <div class="prose"><p class="dropcap">The place is yours now, come to you as the nearest blood of an uncle you never met. {{npc.malachi}} worked this ground the better part of twenty years, and what he left when he vanished this past winter comes to no more than the land itself: four small fields the weeds have taken back, a lean-to that sleeps two, a hundred marks, and {{npc.reuben}}, who worked beside him and has stayed on. It is Spring. The larder holds eighty measures against the year, and there is no fuel laid in at all.</p><p>They say the ground here keeps accounts, and your uncle is not here to say how. You will have the year to learn what that can mean.</p></div>
    advance: "Walk the fields"
    advance_sub: "begin the year"

  silas_welcome:
    eyebrow: "A caller · Day 1"
    title: "{{npc.silas.first}}'s Welcome"
    dir: "[a man in a good coat on a poor road, a ledger in his saddlebag, not dismounting]"
    body: >-
      <div class="prose"><p>{{npc.silas}} reins up at your gate and does not get down. <span class="said">“My name is {{npc.silas}}, of the bank in {{place.town}}. I held the paper on this place for your uncle, and now that it has passed to you, I hold it on you.”</span> He says it the way another man might remark on the weather. <span class="said">“A hundred and fifty a year to the bank. The debt came down to you along with the land. Not this year, nor the next: the charter allows a new holder his feet under him. After that it minds its dates, and so will I.”</span> He looks a long moment at the soft ground by the east field, and something crosses his face he does not explain.</p></div>
    choices:
      obliged:
        text: "“Obliged, Mr. {{term.ridley}}.”"
        sub: "keep the peace with your banker"
        result: "He nods and rides off. You are, it seems, a man with a deadline, two years out."
      needle:
        text: "“You believe the stories about this ground?”"
        sub: "needle him; he does not care for it"
        result: >-
          He pauses. <span class="said">“I believe in the ledger,”</span> he says. <span class="said">“The stories are the ledger's business.”</span> He rides off faster than he came.

  fair:
    eyebrow: "The First Furrow · Spring Fair"
    title: "The town turns out"
    dir: "[a green between a white church and a low saloon; the whole of {{place.town}} gathered to bless the planting]"
    body: >-
      <div class="prose"><p>{{npc.halloway}} makes an expansive welcome and presses <span class="hl off">a small wheat contract on you: eight units, at a fair locked price, come the harvest</span>. {{npc.grange}} walks the new man’s fields and says the old words over them. {{npc.meredith}} watches from the saloon step; the Sheriff watches from the shade.</p><p>Attending costs you a working day of {{npc.reuben}}’s, but a newcomer is only new once.</p></div>
    choices:
      attend:
        text: "Attend the Fair"
        sub: "a blessed field, the wheat contract, but {{npc.reuben}} rests today"
        why: "{{npc.reuben}} spends the whole day at your side in town. No field gets tended today, but the wheat contract locks in and the town takes note."
        result: "You stand the day among them. {{term.grange}} walks {field} and says the old words over it{blessing}. The town has seen your face now, and that counts for something in the {{place.region}}."
        blessing: ", and that ground will come ripe a touch sooner for the blessing"
      skip:
        text: "Skip it and work"
        sub: "the town notes the newcomer who wouldn't come"
        why: "{{npc.reuben}} keeps working the fields as usual. You lose nothing today, but {{place.town}} remembers who stayed away."
        result: "You keep to your fields while the fiddles carry across the green. {{place.town}} notices a man who will not sit with it. It always does."

  # ---------------- SUMMER ----------------

  summer_open:
    eyebrow: "Summer · the market opens"
    title: "The long light"
    body: >-
      <div class="prose"><p class="dropcap">The days stretch and the first crops come on. Word reaches you of Regional buyers who send a wagon for a real load, and of the saloon where {{npc.meredith}} sells the one thing dearer than whiskey: knowing things. The heat sits heavy on the fields.</p></div>
    advance: "To work"
    advance_sub: "begin the season"

  vane_wagon:
    eyebrow: "An opportunity · ~Day 25"
    title: "{{term.vane}}'s Wagon"
    dir: "[a black wagon hung with lanterns, and a courteous man who does not quite meet the eye]"
    body: >-
      <div class="prose"><p>{{npc.ambrose}} brings his wagon up the track. Behind the canvas, a shape that breathes. <span class="said">“A grower,”</span> he says, <span class="said">“strong in the ground, gentle with the seed. A hundred and ten marks, and cheap at it.”</span> He can see you counting. <span class="said">“Or a field hand, sixty: a plainer sort of help.”</span></p><p class="note">A second body is a second mouth. It must eat all winter, or it does not last the winter.</p></div>
    choices:
      grower:
        text: "Buy the Grower, 110 m"
        sub: "strong labor; a heavy winter mouth"
        result: "The canvas comes back. She steps down slow, blinking at the light, and does not yet know your name or her own. You will have to feed her now, through everything."
      hand:
        text: "Buy the Field Hand, 60 m"
        sub: "cheaper help; still a mouth to winter"
        result: "Sixty marks, and a plain quiet worker climbs down from the wagon. {{term.vane}} counts the coin twice and is gone before you can ask where such a one comes from."
      haggle:
        text: "Haggle"
        sub: "{{term.vane}} likes to be liked"
        result_won: >-
          He sighs, charmed despite himself. <span class="said">“A hundred, then, for a face I like.”</span> The grower steps down. Ten marks saved, and a mouth to feed.
        result_lost: >-
          <span class="said">“A hundred and ten is the kindness,”</span> he says, and the price does not move. You let the wagon go on.
      decline:
        text: "Decline"
        sub: "one hand, one mouth: the safe winter"
        result: "You let the wagon roll on toward the next homestead. One hand is a lean crew, but a lean crew is a fed crew."

  moral_fork:
    eyebrow: "The fork · late Summer"
    title_harvest: "The Harvest Won't Wait"
    title_cotton: "The Cotton Won't Wait"
    dir: "[a field standing full, a bruise of storm two days out on the horizon, and a hand swaying on his feet]"
    body: >-
      <div class="prose"><p>{field} stands ready, and <span class="hl wx">the forecast reads storm within two days</span>. {{npc.reuben}} has been on his feet since before light and is grey with it. Push him through the night and you save the crop whole. Let him lie down and you lose a third of it to the weather.</p></div>
    choices:
      work:
        text: "Work him through the night"
        sub: "save the crop · {{npc.reuben}} loses heart"
        result: >-
          The crop comes in whole under a black sky. {{npc.reuben}} does not speak for a day. <span class="whisper">The land takes no notice of a hard day, not yet. A hard day is only a hard day.</span>
      rest:
        text: "Let him rest"
        sub: "lose a third · {{npc.reuben}} mends"
        result: "You send him to his cot. The storm takes what it takes. In the morning he works the wet field with something like loyalty, and you find you do not regret the third you lost."

  # ---------------- FALL ----------------

  fall_open:
    eyebrow: "Fall · the scramble"
    title: "Bring it in, and lay it by"
    body: >-
      <div class="prose"><p class="dropcap">The year tips over into taking-in. Every ripe field wants harvesting and the winter wants fuel, and both want the same short days. From here the almanac keeps a running count in the margin: larder against need, wood against the cold.</p></div>
    advance: "Begin"
    advance_sub: "begin the season"

  harvest_home:
    eyebrow: "Harvest Home · the Fall feast"
    title: "The town lights the long tables"
    dir: "[lanterns strung over the green, and {{npc.nan}} at the dark edge of it, watching the newcomer]"
    body: >-
      <div class="prose"><p>Harvest Home falls square in the crunch. {{npc.bess}} asks you one sharp, honest question and reads your face for the answer. {{npc.ruth}} notes how your hands look, fed or not. The Sheriff offers a cool word about soft ground. To go is to lose a working day; to stay away is to be the man who wouldn’t.</p></div>
    choices:
      go:
        text: "Go to the feast"
        sub: "heart mends, a day not worked"
        result: "You sit at the long tables. {{npc.bess.first}} decides something about you; you cannot tell what. It is warm, and there is bread, and for an evening the ground keeps its accounts to itself."
      stay:
        text: "Stay and bring in the crop"
        sub: "the work gets done"
        result: "You work while the fiddles carry over the fields. The crop is safe and the town is a shade cooler to you. You can live on a safe crop; you cannot eat regard."

  sour:
    eyebrow: "An omen"
    title: "Sour"
    body: >-
      <div class="prose"><p class="whisper">The milk turns though the cow is sound and the pail was clean. It turns again the next morning, and the next. When you ask {{npc.nan}} she does not touch it. <span class="said">“You’ve laid something down,”</span> she says, <span class="said">“that the ground did not care for. It remembers the shape of it.”</span></p></div>
    advance: "Say nothing"
    advance_sub: "continue"

  # ---------------- WINTER ----------------

  winter_open:
    eyebrow: "Winter · the crucible"
    title: "The short days close in"
    dir: "[frost on the well-cap; the whole valley gone quiet and white]"
    body: >-
      <div class="prose"><p class="dropcap">Winter in the {{place.region}} is the year’s true test. There is no planting now, only the larder, the woodpile, and the long dark between them. What you laid by is what you have.</p></div>
    advance: "Face it"
    advance_sub: "begin winter"

  ruth_basket:
    eyebrow: "A knock at the door"
    title: "{{npc.ruth}}'s Basket"
    dir: "[a plain woman with a covered basket and a look that misses nothing]"
    body: >-
      <div class="prose"><p>{{npc.ruth}} {{term.grange}} comes up the frozen track with a basket on her arm. <span class="said">“The church keeps a little back,”</span> she says, <span class="said">“for a hard first winter. It is not charity. It is what a town is for.”</span> Her eyes go once around your yard, counting mouths and measuring the fire.</p></div>
    choices:
      accept:
        text: "Accept the basket"
        sub: "a small debt of regard"
        result: "She sets it down and will not stay for thanks. Bread, salt pork, a sack of coal. It is the difference, this year, between a grave and a spring."
      decline:
        text: "“We'll manage, Sister.”"
        sub: "pride; the fire stays low"
        result: >-
          She looks at you a long moment, then nods once and takes the basket back down the track. <span class="said">“The offer keeps,”</span> she says, without turning. You hope you will not need it.

  long_vigil:
    eyebrow: "Midwinter · the longest night"
    title: "The Long Vigil"
    dir: "[the whole town in the church at midnight, every candle lit, an old capped well-head through the open door]"
    body: >-
      <div class="prose"><p>On the longest night the town does not sleep. They fill the church and they watch, and near midnight {{term.grange}} reads the names of everyone who died in the {{place.region}} this year, slow, one by one, so that none is forgotten and left to be. The liturgy does not say <em>taken.</em> Everyone hears it anyway. Outside, past the graves, the old well-head sits under its cap of iron and salt, and the watching is for it.</p></div>
    choices:
      watch:
        text: "Watch the night through with them"
        sub: "the ground eases its accounting"
        result: "You watch. You do not know what you are watching for, and by dawn you understand no one else quite does either, and that they watch anyway. It is the truest thing you have seen in the {{place.region}}."
      home:
        text: "Go home to your fire"
        sub: "keep your own watch"
        result: "You keep your own watch, alone, over your own ground. In the morning the town is a little colder to the man who wouldn't sit the Vigil."

  # ---------------- YEAR-END (the verdict) ----------------
  # The tally rows and the date line are mechanical report labels and stay in code.

  yearend:
    headline: "“I survived another year.”"
    epi: "The frost breaks along the river first. The household wakes to a dripping eave and a thin bright sun, and the year turns over like a page. You made it. Not everyone does."
    lost_none: "The whole household woke to the thaw. Not everyone in the {{place.region}} can say the same."
    lost_some: "The winter took: {names}. The graves are marked; the ground was given its due."
    ground_whispers: "The ground kept its whispers to itself this year: crows and cold spots and nothing worse."
    ground_warnings: "The ground muttered more than whispers this year. It has your measure now, and a longer memory than you."
    ground_walkers: "Something walked the frost this year that should not walk. The {{place.region}} will not forget it, and neither, now, will you."
    codex: "A Vigil is entered in the Codex for the year you survived. Year Two would bring the market’s regional wagon, the Vat, the deeper reckoning, and, in three more years, {{npc.silas}}’s first collected debt."
    again: "Play another first year"
    again_sub: "new seed, new weather, new choices"

  # ---------------- SYSTEMIC EVENTS (drawn one per season) ----------------

  ev_soft_rain:
    eyebrow: "A growing rain"
    title: "A Soft Rain"
    body: >-
      <div class="prose"><p>Three days of soft, warm rain walk up the valley. The seed drinks it in and the fields come on a shade faster than the almanac promised.</p></div>
    choices:
      good:
        text: "Good."
        sub: "the planted fields grow a little faster"
        result: "Everything planted takes a step toward ripe."

  ev_crows:
    eyebrow: "An unfenced field"
    title: "Crows in the Corn"
    body: >-
      <div class="prose"><p>A wing of crows settles on one of your fields and sets to work with a will. There is no fence to turn them.</p></div>
    choices:
      scare:
        text: "Set {{npc.reuben}} to scaring them"
        sub: "a day's labor spent"
        why: "{{npc.reuben}} spends the day at this field, so every other field goes untended today too, not just this one."
        result: "{{npc.reuben}} spends the day waving and shouting. The crows leave insulted; the crop is whole."
      fence:
        text: "Fence it, 15 m"
        sub: "lasting; costs coin"
        result: "Posts and wire go up. The crows try it once, twice, and give it up. The fence will stand for years."
      feed:
        text: "Let them feed"
        sub: "lose a share of that field"
        result: "You let them have their tithe. It is only a share. You will remember the fence come next planting."

  ev_name:
    eyebrow: "A hand asks"
    title: "A Name of His Own"
    body: >-
      <div class="prose"><p>{{npc.reuben}} stands at the door with his hat in his hands and asks, haltingly, whether he might have a name that is <em>his</em>, not the one that came stamped on the charter papers, but one you’d call him by.</p></div>
    choices:
      grant:
        text: "Grant it gladly"
        sub: "he works the harder for it"
        result: "He says the name over twice, quietly, like a thing he is afraid to drop. He works differently after, like a man, not a tool."
      refuse:
        text: "Refuse him"
        sub: "the asking never comes again"
        result: >-
          <span class="said">“As you say,”</span> he answers, and goes back to the field. He does not ask again, and something in him closes for good. <span class="whisper">The ground, somewhere, makes a small note of it.</span>

  ev_hot_wind:
    eyebrow: "A dry heat"
    title: "The Hot Wind"
    body: >-
      <div class="prose"><p>A hot wind comes off the flats and sits on the valley for a week. The work is punishing under it.</p></div>
    choices:
      rest:
        text: "Rest the worst of it"
        sub: "a slow week"
        result: "You keep to the shade through the killing hours. The work waits; the crew keeps its strength."
      work:
        text: "Work straight through"
        sub: "the crop keeps, but {{npc.reuben}} wilts"
        result: "The rows get worked in the full glare. {{npc.reuben}} comes in each night hollow-eyed. The land, for now, takes no notice of a hard week."

  ev_pedlar:
    eyebrow: "A traveller"
    title: "The Pedlar"
    body: >-
      <div class="prose"><p>A pedlar with a swaybacked mule offers cheap seed by the roadside, and, when pressed, something else, wrapped in oilcloth, that he will not name and will not unwrap.</p></div>
    choices:
      buy:
        text: "Buy the seed, 8 m"
        sub: "+8 seed"
        result: "Good seed at a fair price. The oilcloth stays wrapped, and the pedlar goes on his way looking almost relieved."
      send:
        text: "Send him on"
        sub: "want nothing of it"
        result: "You wave him past. The mule complains; the pedlar tips his hat; the oilcloth bundle rides on to trouble someone else."

  ev_rats:
    eyebrow: "In the granary"
    title: "Rats in the Stores"
    body: >-
      <div class="prose"><p>Something has been in the larder. You find the tell-tale spill of grain and the small dark droppings along the wall.</p></div>
    choices:
      trap:
        text: "Trap them, 4 m"
        sub: "stop the loss"
        result: "Traps and a barn cat borrowed from {{npc.bell}}. The stores hold."
      ignore:
        text: "Ignore it"
        sub: "lose food over the season"
        result: "You let it ride. Ten measures of larder go down small throats before the season's out."

  ev_foundling:
    eyebrow: "At the gate"
    title: "A Foundling"
    dir: "[a thin figure at the fence-line at dusk, not quite a child, not quite not]"
    body: >-
      <div class="prose"><p>A stray hand stands at your gate as the light goes, one of the {{place.region}}’ foundlings, grown wild from no wagon and no vat anyone will own to. It watches you and does not speak.</p></div>
    choices:
      take:
        text: "Take them in"
        sub: "free labor, and another winter mouth"
        why: "Another hand works the fields, but winter's food and fuel needs grow to match, for good."
        result: "You open the gate. It comes in like a cat, wary and grateful at once. Free hands in the field, and one more belly to carry to spring."
      ruth:
        text: "Send them to {{npc.ruth}}"
        sub: "+her regard"
        result: "You point the way to the church, where {{npc.ruth.first}} keeps a cot for such as these. She will remember that you sent them fed, not away."
      turn:
        text: "Turn them out"
        sub: "the ground marks it"
        result: >-
          You close the gate. The figure stands a while in the cold, then is not there. <span class="whisper">Something in the ground turns over in its long sleep.</span>

  ev_bell_word:
    eyebrow: "A rumor at the saloon"
    title: "{{npc.bell}}'s Word"
    body: >-
      <div class="prose"><p>{{npc.bell}}, dry as ever, lets fall over a glass that a Regional buyer will pay above the local price for grain this fall, if you have a wagon-load worth carrying, and the coin to wait for the wagon.</p></div>
    choices:
      note:
        text: "Note it and thank him"
        sub: "good to know for Year Two"
        result: "You file it away. The Regional wagon is a Year-Two concern, but the knowing of it is worth a drink, and Bell is worth cultivating."

  ev_early_frost:
    eyebrow: "An early frost"
    title: "Frost on the Low Ground"
    body: >-
      <div class="prose"><p><span class="hl wx">A hard frost comes a week early to the low fields</span>. Anything ripe should come in now or risk the cold.</p></div>
    choices:
      bring:
        text: "Bring in what's ready"
        sub: "safe, but rushed"
        result: "You get the ripe fields in ahead of the white. It is rough work in the cold, but the harvest is safe under roof."

  ev_cabin_fever:
    eyebrow: "The long dark"
    title: "Cabin Fever"
    body: >-
      <div class="prose"><p>The snow shuts the valley in. Days pass without a face from town, and the household grows short-tempered in the close air of the lean-to.</p></div>
    choices:
      keep:
        text: "Keep them busy and fed"
        sub: "if you can spare it"
        result: "You ration out small comforts: a better supper, a task with an end to it. The crew holds together through the worst of the quiet."

  # ---------------- MALACHI'S JOURNALS (#43) ----------------
  # The uncle's almanac-notebooks, canon from narrative-bible §0.11. One entry
  # unlocks per season across Year 1 (spring on arrival, then one each season).
  # His voice is a flat almanac-keeper's; the flatness is the horror.

  journal_spring:
    heading: "The first spring, 1864"
    body: >-
      <p>Signed the charter today. Four fields and a lean-to by the slow river, off a Company man who would not stay for supper. He was gone before the light went.</p><p>The parcel has no name on the roll, only a number. In time it will take mine, I suppose, the way places do.</p><p>The ground is the strange thing. The east field was warm to the hand, though the frost is not a week gone, warm as a fresh loaf. A good sign, the agent said. Quick ground, grows twice for half the labor. He said it the way a man says a thing he has been told to say.</p><p>I have a field to break and no arms but my own to break it. Tomorrow I see about a hand.</p>

  journal_summer:
    heading: "Summer, 1864"
    body: >-
      <p>Bought a hand off the wagon. A field man, strong, slow to speak. {{npc.reuben}}, the merchant called him. I have never held with the way they are made, but a man cannot work four fields with two arms, and I will not pretend otherwise.</p><p>I told him he eats what I eat and sleeps under the same roof until the barn is raised. He looked at me as if I had spoken in some other tongue. Perhaps I had.</p><p>The quick ground gave up potatoes the size of my fist by August. Half a season. I should be gladder of it than I am.</p>

  journal_fall:
    heading: "Fall, 1864"
    body: >-
      <p>First harvest in, and it is a good one. Better than good. Better than the land has any right to give a man who does not yet know what he is doing.</p><p>The crows came for the gleanings and stayed. They are always here now: on the fence, on the well-sweep, on the ridge of the roof. {{npc.reuben}} says they were here before we were.</p><p>An old woman came up the road at dusk and stood at the edge of the east field without setting foot in it. I called a greeting. She did not answer, only looked a long while at the ground, and then at me, and went back the way she came. {{npc.nan}}, the town calls her. I am told to pay her no mind. I paid her some.</p>

  journal_winter:
    heading: "The first winter, 1864"
    body: >-
      <p>Cold such as I have not known. But the east field does not wholly freeze. There is a patch of it, no bigger than a grave, that stays soft and dark clean through, and steams a little at first light, like something taking slow breaths.</p><p>I put my hand to it on the worst night, when the wind was up and sleep would not come. It was warm. I did not care for how warm.</p><p>{{npc.reuben}} found me out there and did not ask what I was about. He only said, <span class="said">“Best come in, Mister {{npc.malachi}}. Ground keeps its own counsel.”</span> I have thought on that since.</p><p>We are alive. That is the whole of the account this year.</p>

  # Reuben's "knew Malachi" thread (#43): a topic on the Ask Reuben panel. He
  # remembers the uncle and grieves him, and points to the journals. Restrained,
  # no spoiler of the Old Well or the sacrifice (the journals reveal that slowly).
  reuben_malachi:
    topic: "Did you know my uncle?"
    reply: >-
      <p>{{npc.reuben}} goes still, and turns his hat over in his hands. <span class="said">“Mister {{npc.malachi}}. Aye. Near twenty year I worked this ground beside him.”</span></p><p><span class="said">“He was the first ever told me I ate what he ate, slept under his roof. I did not know what to make of it, at the first. He waited while I learned.”</span> He is quiet a moment. <span class="said">“He kept a lamp lit over the east field, some nights. Watching, he said, though he would not say for what. The winter he went, he set me to hold the fields till his blood came. Then he was gone, and no grave to show for it, only the books he left on the shelf.”</span></p><p>He looks at you, steadier than his voice is. <span class="said">“Read them, when the pages come to you. He wrote them for whoever would follow. Reckon that is you now.”</span></p>

  # Town talk scenes (Phase B task 6): three NPC intros reachable via the TOWN
  # tab menu (D-042 to D-047 exploration). Each is a single-beat "go_on" card.
  crake_intro:
    eyebrow: "The smithy"
    title: "Hollis Crake"
    body: >-
      <div class="prose"><p>{{npc.crake}} does not stop his hammer at once. When he does, he sets the piece down with the one hand he has and looks you over. “You would be the one took the old {{lineage}} place,” he says. “Ground like that eats tools. When you are ready to work it proper, a plow, a well, a barn raised, you come to me. I do not give credit, mind.”</p></div>
    choices:
      go_on:
        text: "“I will remember that.”"
        sub: "leave the smith to his iron"
        result: "He is already back at the anvil before you reach the door."

  tolliver_intro:
    eyebrow: "The general store"
    title: "Prudence Tolliver"
    body: >-
      <div class="prose"><p>{{npc.tolliver}} watches your hands more than your face, the way a woman does who has been paid in promises before. “Seed, salt, lamp oil, nails,” she says, naming her shelves without pointing at them. “I carry what a place needs and not one thing it merely wants. Coin on the counter, and we will get on fine. You will find I remember a debt longer than most remember a kindness.”</p></div>
    choices:
      go_on:
        text: "“Fair enough, Mrs. Tolliver.”"
        sub: "take your leave of the counter"
        result: "She has already turned to square a shelf that did not need squaring."

  meredith_rumor:
    eyebrow: "The saloon"
    title: "Meredith Vane"
    body: >-
      <div class="prose"><p>{{npc.meredith}} pours for a man who has stopped listening and leans your way instead. “You hear things, keeping a bar,” she says, low. “The rail is hungry for <span class="hl mkt">grain this year</span>, and what the rail wants, the rail pays for, come the depot. <span class="hl mkt">Wheat and corn</span>, if you have the patience to grow them. The roots? Everyone has roots. A <span class="hl mkt">glut on a market</span> is a poor man's harvest.” She straightens. “Worth knowing, when you decide what to put in the ground.”</p></div>
    choices:
      go_on:
        text: "“I will keep it in mind.”"
        sub: "let her get back to the bar"
        result: "She is already three faces down the counter, pouring and listening."

  # Town talk scenes, remaining five (town-exploration task 2): the last five
  # townsfolk get their intro, a deeper scene (gated by standing), and a short
  # small-talk filler for when their deck is exhausted. Same shape as above.

  silas_town:
    eyebrow: "The bank"
    title: "Silas Ridley"
    body: >-
      <div class="prose"><p>{{npc.silas}} finds you on the street and does not waste words on greeting. He asks after the fields, the fences, and whether you have kept count of what you owe, in that order, and nothing warmer. When you answer him plain, he nods once, as if a column has been added correctly and no more needs saying. He touches his hat at parting, which from him passes for cordial.</p></div>
    choices:
      go_on:
        text: "“The count is kept, Mr. Ridley.”"
        sub: "answer him plain"
        result: "He nods once, satisfied by the arithmetic of it, and is gone before you can say more."

  grange_intro:
    eyebrow: "The church"
    title: "Elias Grange"
    body: >-
      <div class="prose"><p>{{npc.grange}} meets you on the church steps, thin as a fence post and twice as grave. He speaks of the parish roll, of the dead who are owed a Sunday word, and of a duty that does not end at a man's own gate. He asks after your uncle's grave and seems unsurprised there is none to tend. Before you go he says, quiet, that the ground remembers what a man buries in it, and lets the words sit.</p></div>
    choices:
      go_on:
        text: "“I will keep Sunday, Preacher.”"
        sub: "give him the answer he wants"
        result: "He inclines his head, the nearest thing to warmth he offers, and returns to his ledger of souls."

  bell_intro:
    eyebrow: "The doctor's rooms"
    title: "Doc Bell"
    body: >-
      <div class="prose"><p>{{npc.bell}} looks up from a jar of something pickled and says he heard the newcomer had not yet fallen sick or hurt, which he counts a personal failure on the town's part. He asks brief, pointed questions, of the hands, of sleep, of food, of cold, the way a man takes inventory. He writes nothing down when you answer, though you get the sense he forgets nothing either.</p></div>
    choices:
      go_on:
        text: "“I am well enough, Doc.”"
        sub: "answer his questions"
        result: "He grunts, unconvinced, and tells you to come back when that changes, because it will."

  coldwater_intro:
    eyebrow: "The jail"
    title: "Nathaniel Coldwater"
    body: >-
      <div class="prose"><p>{{npc.coldwater}} stands in the jailhouse doorway and looks at you the way he looks at everyone, long and unhurried, as if reading a warrant not yet written. He asks how the hands you keep are getting on, and waits out the silence after the question rather than filling it himself. When you answer, he only says he likes to know a man's ground before trouble finds it, then goes back inside without another word.</p></div>
    choices:
      go_on:
        text: "“They are getting on fine, Sheriff.”"
        sub: "meet his stare"
        result: "He holds your eye a moment longer than comfort allows, then nods once and lets you go."

  nan_intro:
    eyebrow: "The gate"
    title: "Old Nan"
    body: >-
      <div class="prose"><p>{{npc.nan}} is waiting at the gate when you come out, as if she knew the hour you would. She does not ask your name, only looks past you toward the east field a long moment before speaking. She says the ground has always kept its own accounts, longer than any bank's, and that a body learns to listen or a body learns the hard way. Then she is up the road before you think to ask what she means.</p></div>
    choices:
      go_on:
        text: "“What is it you hear, out there?”"
        sub: "ask more than you meant to"
        result: "She only smiles, the way the old do at a question already answered once for someone else, and does not look back."

  meredith_deep:
    eyebrow: "The saloon"
    title: "Meredith Vane"
    body: >-
      <div class="prose"><p>{{npc.meredith}} waits until the bar empties before she says more. She tells you plain that a saloonkeeper hears every debt in {{place.town}} before the bank does, and that yours is spoken of kindly enough, so far. Then, quieter, she asks whether you have had any word from <span class="hl ppl">her brother's wagon</span>, and something in her face goes careful when she says his name. She does not explain herself, and you do not press.</p></div>
    choices:
      go_on:
        text: "“I will send word, if I do.”"
        sub: "let the matter lie"
        result: "She thanks you plainly and goes back to wiping a glass that was already clean."

  crake_deep:
    eyebrow: "The smithy"
    title: "Hollis Crake"
    body: >-
      <div class="prose"><p>{{npc.crake}} sets down the shears he is mending and, for once, does not go straight back to work. He tells you, short and flat, that the arm went to a thresher some ten years back, and that a man learns to work around what is gone or he does not work at all. He says your fences are holding better than most newcomers manage, which from him is no small word. Then he picks the shears back up, and the conversation is over.</p></div>
    choices:
      go_on:
        text: "“I am obliged for the word, Mr. Crake.”"
        sub: "take the rare praise"
        result: "He only grunts and bends back to the iron, having said, by his measure, quite enough."

  tolliver_deep:
    eyebrow: "The general store"
    title: "Prudence Tolliver"
    body: >-
      <div class="prose"><p>{{npc.tolliver}} counts your coin twice before she speaks of anything but goods. She tells you, without much softness, that she buried a husband and has kept this store solvent alone since, and that she has no patience left for men who ask for credit and mean charity. She allows, grudging, that you have not asked her for either. It is, from her, near a compliment.</p></div>
    choices:
      go_on:
        text: "“I mean to keep it that way, Mrs. Tolliver.”"
        sub: "promise her nothing you cannot pay"
        result: "She almost smiles, catches herself, and turns to straighten a shelf instead."

  silas_deep:
    eyebrow: "The bank"
    title: "Silas Ridley"
    body: >-
      <div class="prose"><p>{{npc.silas}} unlocks a drawer and shows you, without preamble, the ledger page in your uncle's account. The payments came regular for years, he says, and then in the last year came early, more than was owed, as if <span class="hl ppl">{{npc.malachi}} meant to clear something ahead of a date only he knew</span>. He closes the drawer before you can look too long, and says only that a man who pays ahead is usually running from something behind. He offers no guess as to what.</p></div>
    choices:
      go_on:
        text: "“Did he say why?”"
        sub: "press for more than he wants to give"
        result: "“He did not,” Silas says, and that is the whole of the answer you get."

  grange_deep:
    eyebrow: "The church"
    title: "Elias Grange"
    body: >-
      <div class="prose"><p>{{npc.grange}} shows you the parish register, where the names of the dead run back further than the town's founding, by any honest count. He says a preacher's true work is not the sermon but the accounting, who is owed a grave, who is owed a prayer, who is owed neither and gets one anyway. He asks, not unkindly, whether you pray for your uncle, and does not wait long for an answer before he tells you it would do no harm. Something behind his grave manner looks, for a moment, like fear worn down into habit.</p></div>
    choices:
      go_on:
        text: "“I will say a word for him.”"
        sub: "give the preacher what he asks"
        result: "He nods, satisfied, and marks something small in the register you do not see."

  bell_deep:
    eyebrow: "The doctor's rooms"
    title: "Doc Bell"
    body: >-
      <div class="prose"><p>{{npc.bell}} pours two fingers of something medicinal and admits, dry as ever, that half his practice these days is <span class="hl omen">fevers no textbook accounts for, and hands that will not stop shaking though nothing ails them plain</span>. He says he keeps his own notes on it, separate from the town's official record, and has not decided who ought to see them. He studies you a moment over his spectacles, the way he studies a wound before deciding how deep it runs, then changes the subject, as if he had said more than he meant to.</p></div>
    choices:
      go_on:
        text: "“What sort of fevers, Doc?”"
        sub: "ask the question he was hoping you would not"
        result: "“The sort I would rather not name before I am certain,” he says, and pours himself another two fingers."

  coldwater_deep:
    eyebrow: "The jail"
    title: "Nathaniel Coldwater"
    body: >-
      <div class="prose"><p>{{npc.coldwater}} does not raise his voice, which is somehow worse than if he had. He tells you, plain, that <span class="hl omen">he has walked more than one homestead where a farmer's hands went missing quiet and no one asked after them</span>, and that he means to keep asking regardless whether anyone wants him to. He says the law in {{place.town}} does not much care how a man runs his own ground, but he does, and he wanted that said once, to your face, so no one can claim later he gave no warning. He touches his hat and goes, and you are left certain he meant every word.</p></div>
    choices:
      go_on:
        text: "“I hear you, Sheriff.”"
        sub: "let the warning land"
        result: "He only nods, once, and does not soften it with anything more."

  nan_deep:
    eyebrow: "The gate"
    title: "Old Nan"
    body: >-
      <div class="prose"><p>{{npc.nan}} takes your hand a moment longer than a greeting requires and turns it over, reading the calluses like a page. She tells you the ground under the east field has always kept what is given it, <span class="hl omen">kindness and cruelty both, and pays each back in its own season and its own coin</span>. She does not say when, or how, only that it has never yet forgotten a debt and does not intend to start with you. Then she lets your hand go and walks on before you can ask her to say it plainer.</p></div>
    choices:
      go_on:
        text: "“What does it pay back, exactly?”"
        sub: "ask her to say it plain"
        result: "She only shakes her head, the way the old do at a question too large for a doorway, and is gone."

  meredith_small:
    eyebrow: "The saloon"
    title: "Meredith Vane"
    body: >-
      <div class="prose"><p>{{npc.meredith}} wipes down the bar and allows there is nothing worth the telling today. “Quiet season,” she says. “I will let you know the moment that changes.”</p></div>
    choices:
      go_on:
        text: "“Obliged, all the same.”"
        sub: "leave her to the bar"
        result: "She lifts a glass in something like a toast and goes back to her pouring."

  crake_small:
    eyebrow: "The smithy"
    title: "Hollis Crake"
    body: >-
      <div class="prose"><p>{{npc.crake}} nods you a greeting without breaking his hammer's rhythm. Nothing new at the forge today, only iron and the work it takes.</p></div>
    choices:
      go_on:
        text: "“I will not keep you from it.”"
        sub: "leave the smith to his iron"
        result: "He is already back at the anvil before the door swings shut."

  tolliver_small:
    eyebrow: "The general store"
    title: "Prudence Tolliver"
    body: >-
      <div class="prose"><p>{{npc.tolliver}} counts her till and spares you half a nod. “Shelves are stocked, accounts are square,” she says. “Come back when you need something.”</p></div>
    choices:
      go_on:
        text: "“I will, Mrs. Tolliver.”"
        sub: "take your leave of the counter"
        result: "She has already turned back to her ledger, pencil moving."

  silas_small:
    eyebrow: "The bank"
    title: "Silas Ridley"
    body: >-
      <div class="prose"><p>{{npc.silas}} passes you on the street and touches his hat, brief and correct. “The ledger has nothing new to say of you today,” he says, and keeps walking.</p></div>
    choices:
      go_on:
        text: "“Good day, Mr. Ridley.”"
        sub: "let him go on his way"
        result: "He is already three doors down, hat set square, minding his dates."

  grange_small:
    eyebrow: "The church"
    title: "Elias Grange"
    body: >-
      <div class="prose"><p>{{npc.grange}} is sweeping the church steps and pauses only long enough to nod. “No burying today,” he says. “Small mercies.”</p></div>
    choices:
      go_on:
        text: "“Small mercies, Preacher.”"
        sub: "agree and move on"
        result: "He returns to his sweeping, unhurried, as though the churchyard had all the time there was."

  bell_small:
    eyebrow: "The doctor's rooms"
    title: "Doc Bell"
    body: >-
      <div class="prose"><p>{{npc.bell}} is cleaning a lens when you pass his window. He raises two fingers in greeting, dry as ever. “Nothing catching today,” he says. “Come back if that changes.”</p></div>
    choices:
      go_on:
        text: "“I will hold you to that, Doc.”"
        sub: "take him at his word"
        result: "He goes back to his lens without looking up again."

  coldwater_small:
    eyebrow: "The jail"
    title: "Nathaniel Coldwater"
    body: >-
      <div class="prose"><p>{{npc.coldwater}} is leaning in the jailhouse doorway, watching the street the way he watches everything. He gives you a long look and a short nod, and says nothing at all.</p></div>
    choices:
      go_on:
        text: "“Sheriff.”"
        sub: "nod back and keep walking"
        result: "He watches you the whole way up the street. You can feel it between your shoulders."

  nan_small:
    eyebrow: "The gate"
    title: "Old Nan"
    body: >-
      <div class="prose"><p>Old Nan is at the roadside picking something small and green. She does not look up. “Ground's quiet today,” she says. “That will not last.”</p></div>
    choices:
      go_on:
        text: "“I will keep that in mind.”"
        sub: "leave her to her picking"
        result: "She only hums something wordless and keeps to her work."
