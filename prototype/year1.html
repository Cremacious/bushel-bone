          // "+regard" tag are naturally near-identical, unlike the trimmed
          // cases above where sub still carried an extra, non-tag detail.
          {t:"Send them to Sister Ruth",sub:"+her regard",tag:"+regard",go:()=>resolve(()=>{S.regard+=3;},"You point the way to the church, where Ruth keeps a cot for such as these. She will remember that you sent them fed, not away.")},
          // No tag here, deliberately: this raises the hidden Reckoning meter
          // (S.reckoning) via markCruelty(), and that meter must never be
          // named, numbered, or hinted at in a tag/badge. The oblique sub
          // ("the ground marks it") stays; the tag stays absent.
          {t:"Turn them out",sub:"the ground marks it",go:()=>resolve(()=>{S.reckoning+=1;markCruelty();},"You close the gate. The figure stands a while in the cold, then is not there. <span class=\"whisper\">Something in the ground turns over in its long sleep.</span>")},
        ]}),
      ()=>card({eyebrow:"A rumor at the saloon",title:"Doc Bell's Word",
        setting:"saloon", speaker:"bell",
        body:'<div class="prose"><p>Doc Bell, dry as ever, lets fall over a glass that a Regional buyer will pay above the local price for grain this fall, if you have a wagon-load worth carrying, and the coin to wait for the wagon.</p></div>',
        choices:[
          {t:"Note it and thank him",sub:"good to know for Year Two",tag:"+regard",primary:true,go:()=>resolve(()=>{S.regard+=1;},"You file it away. The Regional wagon is a Year-Two concern, but the knowing of it is worth a drink, and Bell is worth cultivating.")},
        ]}),
      ()=>card({eyebrow:"An early frost",title:"Frost on the Low Ground",
        setting:"fields",
        body:'<div class="prose"><p>A hard frost comes a week early to the low fields. Anything ripe should come in now or risk the cold.</p></div>',
        choices:[
          {t:"Bring in what's ready",sub:"safe, but rushed",primary:true,go:()=>resolve(()=>{S.fields.forEach(f=>{if(ripe(f))f.tended=false;});},"You get the ripe fields in ahead of the white. It is rough work in the cold, but the harvest is safe under roof.")},
        ]}),
    ],
    winter:[
      ()=>card({eyebrow:"The long dark",title:"Cabin Fever",
        setting:"homestead",
        body:'<div class="prose"><p>The snow shuts the valley in. Days pass without a face from town, and the household grows short-tempered in the close air of the lean-to.</p></div>',
        choices:[
          {t:"Keep them busy and fed",sub:"if you can spare it",tag:"+heart",primary:true,go:()=>resolve(()=>{const f=fore(); if(S.food>20&&f&&f.morale<5)f.morale++;},"You ration out small comforts: a better supper, a task with an end to it. The crew holds together through the worst of the quiet.")},
        ]}),
    ],
  };
  function drawSystemic(seasonKey){
    // pacing: mostly one event; occasionally quiet
    const pool = SYSTEMIC[seasonKey];
    if(!pool || !pool.length){ next(); return; }
    // don't repeat within a run where avoidable
    S.flags._seen = S.flags._seen||{};
    let candidates = pool.filter((_,i)=>!S.flags._seen[seasonKey+i]);
    if(!candidates.length){ candidates=pool; S.flags._seen={}; }
    const idx = pool.indexOf(pick(candidates));
    S.flags._seen[seasonKey+idx]=true;
    pool[idx]();
  }

  /* ---------------- reckoning alarm ---------------- */
  function checkReckoningAlarm(){
    const band = reckBand();
    if(band==="Warnings" && !S.alarmedTiers.Warnings){ S.alarmedTiers.Warnings = true; return "Warnings"; }
    if(band==="Walkers" && !S.alarmedTiers.Walkers){ S.alarmedTiers.Walkers = true; return "Walkers"; }
    return null;
  }
  const ALARM_TEXT = {
    Warnings: "Hold a moment. The hands feel it and now so do I. The ground has took against something you have done. Milk turns though the cow is sound, and the crows will not leave the rail. Ease off, or it will come to collect. I would not see it collect from us.",
    Walkers:  "You will want to hear this. What we laid down is not staying down. There are prints in the frost that start at the graves and end at our door. I have seen this before, on a place that is not there anymore. Make it right while there is still a right to make.",
  };
  function showReckoningAlarm(band){
    const fm = foreman(); if(!fm) return;
    const html = '<div class="talkport warn"><div class="silh"><div class="head"></div><div class="neck"></div><div class="shoulders"></div></div><div class="nameplate"><b>'+fm.name+'</b><span>grim</span></div></div>'+
      '<div class="warnlabel">a word from your foreman</div>'+
      '<div class="warntext">'+ALARM_TEXT[band]+'</div>'+
      '<div class="warnacts"><div class="wbtn pri" data-a="heed">I hear you.</div><div class="wbtn" data-a="press">The work comes first.</div></div>';
    openOverlay(html, panel=>{ panel.querySelectorAll('.wbtn[data-a]').forEach(el=>el.addEventListener('click',closeOverlay)); });
  }
  function maybeAlarm(){ if(!foreman()) return; const b=checkReckoningAlarm(); if(b) showReckoningAlarm(b); }

  /* ---------------- info popovers (ledger + screen help) ---------------- */
  function openInfo(title, html){
    openOverlay('<div class="rosterhdr"><b>'+title+'</b></div><div class="prose" style="padding:0 16px 16px">'+html+'</div>');
  }
  const SCREEN_HELP = {
    brief: "A moment to read. Tap the button below to carry on.",
    event: "A choice to make. Each button says what it costs and what it changes, plainly, under the words. Pick one.",
    planting: "Tap a crop for each empty field, or leave it fallow to let the ground rest. Seed is spent first, then coin. Tap Sow it so when every field is set.",
    assignment: "Open the roster to give each hand a task for the season, then put them to work.",
    market: "Send each harvest to the larder to eat, or to market to sell. Cash crops always sell. Tap Close the day-book when every lot is set.",
    provision: "Buy coal and grain against what winter will need. Tap Lay it in when you are done spending.",
    dusk: "The season's accounts, closed and read. Tap below to turn the page.",
    yearend: "The year is decided. Read how it went, then take the charter again.",
  };
  function setScreenType(t){ S.screenType = t; }
  const LEDGER_HELP = {
    coin: "Marks. Money for seed, coal, farmhands, and fences.",
    larder: "Stored food. The household eats it every season. Run out in winter, and someone dies.",
    fuel: "Wood and coal laid by. Only spent in winter. Too little, and the frailest freezes.",
    seed: "Seed stock. Spent first when you plant, before coin.",
  };
  const REGARD_HELP = "Regard is how the town of Marrow's Cross has come to see you, the newcomer. Every choice that touches your neighbors nudges it up or down. For now it marks your standing in your own eyes. In time it can open doors, or close them.";

  /* ---------------- overlay layer ---------------- */
  function openOverlay(html, wire){
    const root=document.getElementById("overlay"), panel=document.getElementById("overlay-panel");
    panel.innerHTML = html; root.classList.add("on");
    if(wire) wire(panel);
  }
  function closeOverlay(){ document.getElementById("overlay").classList.remove("on"); document.getElementById("overlay-panel").innerHTML=""; }
  function openAskReuben(){
    if(needsForeman()){ openPromote(); return; }
    const fm = foreman();
    if(!fm){ openOverlay('<div class="rosterhdr"><b>No foreman</b></div><div class="prose" style="padding:0 16px 16px"><p>You have named no one to speak for the hands. Open the roster and make one your foreman.</p></div>'); return; }
    const port = '<div class="talkport"><div class="silh"><div class="head"></div><div class="neck"></div><div class="shoulders"></div></div><div class="nameplate"><b>'+fm.name+'</b><span>your foreman</span></div></div>';
    const answer = '<div class="answer" id="reuben-answer"></div>';
    const asks = [
      {t:"What should I be doing?", fn:()=>{ document.getElementById("reuben-answer").innerHTML = reubenGuidance(); }},
      {t:"How are the hands?", fn:()=>{ document.getElementById("reuben-answer").innerHTML = collectiveLine(); }},
      (tutGuided()
        ? {t:"Stop the tips", fn:()=>{ tutSetGuided(false); dismissTip(); closeOverlay(); }}
        : {t:"Walk me through the basics again", fn:()=>{ replayTips(); closeOverlay(); }}),
      {t:"Nothing, carry on", fn:closeOverlay},
    ];
    const html = port + '<div class="askpanel-body">'+answer + asks.map((a,i)=>'<div class="askq" data-i="'+i+'">'+a.t+'</div>').join('') + '</div>';
    openOverlay(html, panel=>{ panel.querySelectorAll('.askq[data-i]').forEach(el=>el.addEventListener('click',()=>asks[+el.dataset.i].fn())); });
  }

  let tutHi = [];
  function tip(id, text, selector){
    if(!tutGuided()) return;
    if(!S.tutShown) S.tutShown = {};
    if(S.tutShown[id]) return;
    S.tutShown[id] = true;
    const body = '<div class="tut-tip"><div class="who"><span class="rdot"></span> Reuben</div><p>'+text+'</p><button class="got">Got it</button></div>';
    const overlayOn = document.getElementById("overlay").classList.contains("on");
    let container;
    if(overlayOn){
      container = document.getElementById("overlay-panel");
      container.insertAdjacentHTML("afterbegin", body);
    } else {
      container = document.getElementById("tipbar"); container.innerHTML = body; container.classList.add("on");
    }
    if(selector){ document.querySelectorAll(selector).forEach(el=>{ el.classList.add("tut-highlight"); tutHi.push(el); }); }
    // wire the freshly inserted button within its own container, so a bar tip and
    // an overlay tip open at once cannot collide on a shared id.
    const got = container.querySelector(".tut-tip .got");
    if(got) got.addEventListener("click", dismissTip);
  }
  function dismissTip(){
    const tb = document.getElementById("tipbar"); if(tb){ tb.classList.remove("on"); tb.innerHTML=""; }
    const t = document.querySelector("#overlay-panel .tut-tip"); if(t) t.remove();
    tutHi.forEach(el=>el.classList.remove("tut-highlight")); tutHi = [];
  }
  function replayTips(){ if(S) S.tutShown = {}; tutSetGuided(true); }

  function tutGuided(){ try { return localStorage.getItem("bb_guided")==="1"; } catch(e){ return false; } }
  function tutSetGuided(on){ try { localStorage.setItem("bb_guided", on?"1":"0"); } catch(e){} }
  function tutSeen(){ try { return localStorage.getItem("bb_seenIntro")==="1"; } catch(e){ return true; } }
  function tutInit(){
    if(tutSeen()) return;
    try { localStorage.setItem("bb_seenIntro","1"); } catch(e){}
    const html =
      '<div class="talkport"><div class="silh"><div class="head"></div><div class="neck"></div><div class="shoulders"></div></div>'+
      '<div class="nameplate"><b>Reuben</b><span>your foreman</span></div></div>'+
      '<div class="askpanel-body"><div class="answer">I am Reuben, and I will be your foreman. New to the Sull, are you. The first year is the hard one. Let me walk you through it and you will have the way of it by spring.</div>'+
      '<div class="askq" id="tut-yes">Walk me through it</div>'+
      '<div class="askq" id="tut-no">I will find my own way</div></div>';
    openOverlay(html, panel=>{
      panel.querySelector("#tut-yes").addEventListener("click",()=>{
        tutSetGuided(true); closeOverlay();
        if(typeof tip==="function") tip("bar","See this. That is me, always here at the foot of the page. Tap it any time you are unsure and I will tell you the next thing that matters.","#askbar");
      });
      panel.querySelector("#tut-no").addEventListener("click",()=>{ tutSetGuided(false); closeOverlay(); });
    });
  }

  /* ---------------- theme toggle ---------------- */
  document.getElementById("themetog").addEventListener("click",function(){
    const root=document.documentElement;
    const cur=root.getAttribute("data-theme");
    const dark = cur? cur==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark?"light":"dark");
    this.textContent = dark? "☾ night" : "☀ day";
  });

  document.getElementById("overlay-scrim").addEventListener("click", closeOverlay);
  document.getElementById("askbar").addEventListener("click", openAskReuben);
  document.getElementById("helptog").addEventListener("click", ()=>{
    openInfo("What do I do here?", SCREEN_HELP[S.screenType] || SCREEN_HELP.event);
  });

  /* ---------------- boot ---------------- */
  newGame((Math.random()*1e9)>>>0);

  if (typeof window !== "undefined") {
    window.__BB_TEST__ = { getState:()=>S, foreman, fore, livingHands, extraHands, condition, reckBand, mkHand, harvestStep, openOverlay, closeOverlay, openRoster, assignHand, applyLabor, openHand, reubenGuidance, openAskReuben, checkReckoningAlarm, showReckoningAlarm, needsForeman, promoteForeman, openPromote, collectiveLine, tutInit, tutGuided, tutSetGuided, tip, dismissTip, replayTips, setPlate, openInfo, SCREEN_HELP, LEDGER_HELP };
  }

  runStep();
  tutInit();
})();
</script>

</body>
</html>
